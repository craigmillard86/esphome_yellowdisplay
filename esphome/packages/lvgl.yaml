# =============================================================================
# Package: LVGL Graphics Library Configuration
# Purpose: LVGL initialization and UI framework for CYD display
# Dependencies: packages/display.yaml (main_display), packages/touch.yaml (touch_controller)
# Exposes: lvgl component with style definitions
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# =============================================================================
# Font Definitions (must be at root level, not inside lvgl)
# =============================================================================

font:
  # Primary text font - 24pt for titles
  - file: "gfonts://Roboto@500"
    id: roboto_24
    size: 24
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  # Body text font - 16pt for buttons, labels
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  # Small text font - 12pt for metadata, time
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  # Material Design Icons for UI controls
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_24
    size: 24
    glyphs:
      - "\U000F040A"  # mdi:play
      - "\U000F03E4"  # mdi:pause
      - "\U000F04AD"  # mdi:skip-previous
      - "\U000F04AE"  # mdi:skip-next
      - "\U000F057E"  # mdi:volume-high
      - "\U000F0580"  # mdi:volume-low
      - "\U000F0581"  # mdi:volume-mute
      - "\U000F0493"  # mdi:shuffle
      - "\U000F0456"  # mdi:repeat

# =============================================================================
# LVGL Configuration
# =============================================================================

lvgl:
  # Display and touch bindings
  displays:
    - main_display
  touchscreens:
    - touch_controller

  # Color depth - 16-bit RGB565 for ILI9341
  color_depth: 16

  # Buffer configuration for ESP32 RAM constraints
  buffer_size: 25%

  # Update interval for LVGL tasks (4Hz update rate)
  update_interval: 250ms

  # Log level for LVGL debugging
  log_level: INFO

  # Idle timeout handling
  on_idle:
    timeout: 60s
    then:
      - logger.log:
          tag: "ui"
          level: INFO
          format: "UI idle detected after 60 seconds"

  # =============================================================================
  # Style Definitions
  # =============================================================================
  style_definitions:
    # Base screen style - dark background
    - id: style_screen
      bg_color: 0x121212
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0
      text_color: 0xFFFFFF

    # Primary buttons (play/pause, main actions)
    - id: style_btn_primary
      radius: 8
      bg_color: 0x00D1FF
      bg_opa: COVER
      border_width: 0
      text_color: 0x121212
      pad_all: 12

    # Secondary buttons
    - id: style_btn_secondary
      radius: 8
      bg_color: 0x1E1E1E
      bg_opa: COVER
      border_width: 2
      border_color: 0x00D1FF
      text_color: 0xFFFFFF
      pad_all: 12

    # Icon buttons (circular)
    - id: style_btn_icon
      radius: 24
      bg_color: 0x1E1E1E
      bg_opa: COVER
      border_width: 0
      pad_all: 16

    # Primary text (song title)
    - id: style_label_primary
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      pad_all: 4

    # Secondary text (artist, metadata)
    - id: style_label_secondary
      text_color: 0xB3B3B3
      bg_opa: TRANSP
      border_width: 0
      pad_all: 4

    # Small text (time indicators)
    - id: style_label_small
      text_color: 0xB3B3B3
      bg_opa: TRANSP
      border_width: 0
      pad_all: 2

    # Error text
    - id: style_label_error
      text_color: 0xFF6B35
      bg_opa: TRANSP
      border_width: 0
      pad_all: 4

    # Progress bar
    - id: style_bar_progress
      bg_color: 0x1E1E1E
      bg_opa: COVER
      radius: 4
      border_width: 0

    # Container card style
    - id: style_container_card
      bg_color: 0x1E1E1E
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x2A2A2A
      pad_all: 16

    # Status bar container
    - id: style_container_status
      bg_color: 0x000000
      bg_opa: 80%
      radius: 0
      border_width: 0
      pad_all: 8

  # =============================================================================
  # Pages - UI Screens
  # =============================================================================
  pages:
    # Boot/Loading screen
    - id: page_boot
      bg_color: 0x121212
      widgets:
        - label:
            align: CENTER
            text: "Music Remote"
            text_color: 0xFFFFFF
            text_font: roboto_24

    # =========================================================================
    # Main Now Playing Screen
    # =========================================================================
    # This is the main playback screen showing:
    # - Connection status at top
    # - Track title (large, centered)
    # - Artist name (smaller, gray, centered)
    # - Playback control buttons (prev, play/pause, next) at bottom
    # Display: 320x240 pixels in landscape orientation
    - id: page_main
      # Apply base screen style (dark background #121212, white text)
      styles: style_screen

      widgets:
        # ---------------------------------------------------------------------
        # Status Label (Top)
        # ---------------------------------------------------------------------
        # Shows connection state: "Connected", "Disconnected", etc.
        # Positioned at top center of screen
        - label:
            id: lbl_status
            text: "Connected"
            styles: style_label_secondary
            text_font: roboto_16
            text_color: 0x00D1FF            # Vibrant Cyan for connected state
            text_align: CENTER
            align: TOP_MID
            y: 10
            width: 300
            bg_opa: TRANSP

        # ---------------------------------------------------------------------
        # Track Title (Center - Upper)
        # ---------------------------------------------------------------------
        # Large white text showing current track name
        # Centered horizontally, positioned above center
        - label:
            id: lbl_title
            text: "No Track Playing"
            styles: style_label_primary
            text_font: roboto_24
            text_color: 0xFFFFFF            # White text
            text_align: CENTER
            align: CENTER
            y: -30                           # Above center
            width: 300                       # Allow wrapping if needed
            bg_opa: TRANSP
            long_mode: DOT                   # Truncate with ellipsis if too long

        # ---------------------------------------------------------------------
        # Artist Name (Center - Lower)
        # ---------------------------------------------------------------------
        # Smaller gray text showing artist name
        # Centered horizontally, positioned below track title
        - label:
            id: lbl_artist
            text: "Unknown Artist"
            styles: style_label_secondary
            text_font: roboto_16
            text_color: 0xB3B3B3            # Secondary gray text
            text_align: CENTER
            align: CENTER
            y: 10                            # Below center
            width: 300
            bg_opa: TRANSP
            long_mode: DOT                   # Truncate with ellipsis if too long

        # ---------------------------------------------------------------------
        # Previous Track Button (Left)
        # ---------------------------------------------------------------------
        - button:
            id: btn_prev
            styles: style_btn_secondary
            width: 56
            height: 56
            align: BOTTOM_RIGHT
            x: -40
            y: -20
            on_click:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Previous button pressed"
                - homeassistant.service:
                    service: media_player.media_previous_track
                    data:
                      entity_id: media_player.lards_speaker2
            widgets:
              - label:
                  text: "\U000F04AD"
                  text_font: icons_24
                  text_color: 0xFFFFFF
                  align: CENTER

        # ---------------------------------------------------------------------
        # Play/Pause Button (Center)
        # ---------------------------------------------------------------------
        - button:
            id: btn_play
            styles: style_btn_primary
            width: 64
            height: 64
            align: BOTTOM_MID
            y: -16
            on_click:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Play/Pause button pressed"
                - homeassistant.service:
                    service: media_player.media_play_pause
                    data:
                      entity_id: media_player.lards_speaker2
            widgets:
              - label:
                  id: lbl_play_icon
                  text: "\U000F040A"
                  text_font: icons_24
                  text_color: 0x121212
                  align: CENTER

        # ---------------------------------------------------------------------
        # Next Track Button (Right)
        # ---------------------------------------------------------------------
        - button:
            id: btn_next
            styles: style_btn_secondary
            width: 56
            height: 56
            align: BOTTOM_LEFT
            x: 40
            y: -20
            on_click:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Next button pressed"
                - homeassistant.service:
                    service: media_player.media_next_track
                    data:
                      entity_id: media_player.lards_speaker2
            widgets:
              - label:
                  text: "\U000F04AE"
                  text_font: icons_24
                  text_color: 0xFFFFFF
                  align: CENTER

# =============================================================================
# Dynamic Update Notes (Now Playing Screen)
# =============================================================================
# The following widget IDs are exposed for dynamic updates from state machine:
#
# - lbl_status: Update connection state text and color
#   Example: id(lbl_status).set_text("Disconnected");
#            id(lbl_status).set_style_text_color(lv_color_hex(0xFF6B35), 0);
#
# - lbl_title: Update with current track title from media player
#   Example: id(lbl_title).set_text(title.c_str());
#
# - lbl_artist: Update with current artist name from media player
#   Example: id(lbl_artist).set_text(artist.c_str());
#
# - btn_play: Access play button for visual state updates
#
# - lbl_play_icon: Toggle between play/pause icons based on playback state
#   Playing: id(lbl_play_icon).set_text("\U000F03E4");  // mdi:pause
#   Paused:  id(lbl_play_icon).set_text("\U000F040A");  // mdi:play
#
# - btn_prev / btn_next: Access for enabling/disabling based on playlist position
#
# Media Player Entity:
# The buttons call services on "media_player.lards_speaker2" entity.
# Update this entity_id to match your actual Home Assistant media player entity.
# =============================================================================

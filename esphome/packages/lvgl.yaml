# =============================================================================
# Package: LVGL Graphics Library Configuration
# Purpose: LVGL initialization and UI framework for CYD display
# Dependencies: packages/display.yaml (main_display), packages/touch.yaml (touch_controller)
# Exposes: lvgl component with style definitions
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# =============================================================================
# Font Definitions (must be at root level, not inside lvgl)
# =============================================================================

font:
  # Primary text font - 24pt for titles
  - file: "gfonts://Roboto@500"
    id: roboto_24
    size: 24
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  # Body text font - 16pt for buttons, labels
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  # Small text font - 12pt for metadata, time
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  # Material Design Icons for UI controls
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_24
    size: 24
    glyphs:
      - "\U000F040A"  # mdi:play
      - "\U000F03E4"  # mdi:pause
      - "\U000F04AD"  # mdi:skip-previous
      - "\U000F04AE"  # mdi:skip-next
      - "\U000F057E"  # mdi:volume-high
      - "\U000F0580"  # mdi:volume-low
      - "\U000F0581"  # mdi:volume-mute
      - "\U000F0493"  # mdi:shuffle
      - "\U000F0456"  # mdi:repeat

# =============================================================================
# LVGL Configuration
# =============================================================================

lvgl:
  # Display and touch bindings
  displays:
    - main_display
  touchscreens:
    - touch_controller

  # Color depth - 16-bit RGB565 for ILI9341
  color_depth: 16

  # Buffer configuration for ESP32 RAM constraints
  buffer_size: 25%

  # Update interval for LVGL tasks (4Hz update rate)
  update_interval: 250ms

  # Log level for LVGL debugging
  log_level: INFO

  # Idle timeout handling
  on_idle:
    timeout: 60s
    then:
      - logger.log:
          tag: "ui"
          level: INFO
          format: "UI idle detected after 60 seconds"

  # =============================================================================
  # Style Definitions
  # =============================================================================
  style_definitions:
    # Base screen style - dark background
    - id: style_screen
      bg_color: 0x121212
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0
      text_color: 0xFFFFFF

    # Primary buttons (play/pause, main actions)
    - id: style_btn_primary
      radius: 8
      bg_color: 0x00D1FF
      bg_opa: COVER
      border_width: 0
      text_color: 0x121212
      pad_all: 12

    # Secondary buttons
    - id: style_btn_secondary
      radius: 8
      bg_color: 0x1E1E1E
      bg_opa: COVER
      border_width: 2
      border_color: 0x00D1FF
      text_color: 0xFFFFFF
      pad_all: 12

    # Icon buttons (circular)
    - id: style_btn_icon
      radius: 24
      bg_color: 0x1E1E1E
      bg_opa: COVER
      border_width: 0
      pad_all: 16

    # Primary text (song title)
    - id: style_label_primary
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      pad_all: 4

    # Secondary text (artist, metadata)
    - id: style_label_secondary
      text_color: 0xB3B3B3
      bg_opa: TRANSP
      border_width: 0
      pad_all: 4

    # Small text (time indicators)
    - id: style_label_small
      text_color: 0xB3B3B3
      bg_opa: TRANSP
      border_width: 0
      pad_all: 2

    # Error text
    - id: style_label_error
      text_color: 0xFF6B35
      bg_opa: TRANSP
      border_width: 0
      pad_all: 4

    # Progress bar
    - id: style_bar_progress
      bg_color: 0x1E1E1E
      bg_opa: COVER
      radius: 4
      border_width: 0

    # Container card style
    - id: style_container_card
      bg_color: 0x1E1E1E
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x2A2A2A
      pad_all: 16

    # Status bar container
    - id: style_container_status
      bg_color: 0x000000
      bg_opa: 80%
      radius: 0
      border_width: 0
      pad_all: 8

  # =============================================================================
  # Pages - UI Screens
  # =============================================================================
  pages:
    # Boot/Loading screen
    - id: page_boot
      bg_color: 0x121212
      widgets:
        - label:
            align: CENTER
            text: "Music Remote"
            text_color: 0xFFFFFF
            text_font: roboto_24

    # =========================================================================
    # Main Now Playing Screen - Split Horizontal Layout
    # =========================================================================
    # Layout: Split Horizontal (Left 40% / Right 60%)
    # - Left Panel (0-128px): Album art placeholder with rounded corners
    # - Right Panel (128-320px): Track info, progress, and controls
    # - Bottom (full width): Volume slider spanning entire width
    # Display: 320x240 pixels in landscape orientation
    - id: page_main
      # Apply base screen style (dark background #121212, white text)
      styles: style_screen

      widgets:
        # =====================================================================
        # LEFT PANEL - ALBUM ART AREA (0-128px width)
        # =====================================================================
        # Album art placeholder container with rounded corners
        # Positioned at x=0, vertically centered
        # Size: 128x128px to fit within left 40% panel (128px wide)
        - obj:
            id: album_art_container
            x: 16
            y: 56
            width: 96
            height: 96
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 12
            border_width: 2
            border_color: 0x2A2A2A
            border_opa: COVER
            pad_all: 0

        # =====================================================================
        # RIGHT PANEL - CONTENT AREA (128-320px width = 192px)
        # =====================================================================

        # ---------------------------------------------------------------------
        # Status Label (Right Panel Top)
        # ---------------------------------------------------------------------
        # Shows connection state: "Connected", "Disconnected", etc.
        # Positioned at top of right panel
        - label:
            id: lbl_status
            text: "Connected"
            styles: style_label_secondary
            text_font: roboto_12
            text_color: 0x00D1FF            # Vibrant Cyan for connected state
            text_align: LEFT
            align: TOP_LEFT
            x: 136
            y: 8
            width: 176
            bg_opa: TRANSP

        # ---------------------------------------------------------------------
        # Track Title (Right Panel)
        # ---------------------------------------------------------------------
        # Large white text showing current track name
        # Positioned in right panel below status
        - label:
            id: lbl_title
            text: "No Track Playing"
            styles: style_label_primary
            text_font: roboto_16
            text_color: 0xFFFFFF            # White text
            text_align: LEFT
            align: TOP_LEFT
            x: 136
            y: 30
            width: 176
            bg_opa: TRANSP
            long_mode: SCROLL_CIRCULAR       # Scroll long text continuously

        # ---------------------------------------------------------------------
        # Artist Name (Right Panel)
        # ---------------------------------------------------------------------
        # Smaller gray text showing artist name
        # Positioned below track title
        - label:
            id: lbl_artist
            text: "Unknown Artist"
            styles: style_label_secondary
            text_font: roboto_12
            text_color: 0xB3B3B3            # Secondary gray text
            text_align: LEFT
            align: TOP_LEFT
            x: 136
            y: 54
            width: 176
            bg_opa: TRANSP
            long_mode: SCROLL_CIRCULAR       # Scroll long text continuously

        # ---------------------------------------------------------------------
        # Album Name (Right Panel)
        # ---------------------------------------------------------------------
        # Small gray text showing album name
        # Positioned below artist name
        - label:
            id: lbl_album
            text: ""
            styles: style_label_small
            text_font: roboto_12
            text_color: 0xB3B3B3            # Secondary gray text
            text_align: LEFT
            align: TOP_LEFT
            x: 136
            y: 72
            width: 176
            bg_opa: TRANSP
            long_mode: SCROLL_CIRCULAR       # Scroll long text continuously

        # ---------------------------------------------------------------------
        # Progress Bar Section (Right Panel)
        # ---------------------------------------------------------------------
        # Elapsed time label (left side of progress bar) - MM:SS format
        - label:
            id: lbl_elapsed_time
            text: "0:00"
            styles: style_label_small
            text_font: roboto_12
            text_color: 0xB3B3B3
            align: TOP_LEFT
            x: 136
            y: 100
            width: 35
            text_align: LEFT

        # Total/Remaining time label (right side of progress bar) - MM:SS format
        - label:
            id: lbl_total_time
            text: "0:00"
            styles: style_label_small
            text_font: roboto_12
            text_color: 0xB3B3B3
            align: TOP_LEFT
            x: 277
            y: 100
            width: 35
            text_align: RIGHT

        # Progress slider (touchable for seeking)
        # Positioned in right panel between time labels
        - slider:
            id: progress_slider
            align: TOP_LEFT
            x: 174
            y: 102
            width: 100
            height: 8
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 4
            indicator:
              bg_color: 0x00D1FF
              bg_opa: COVER
              radius: 4
            knob:
              bg_color: 0x00D1FF
              bg_opa: COVER
              radius: 6
              width: 12
              height: 12
            on_release:
              then:
                - lambda: |-
                    // Get the slider value (0-100 percentage)
                    float slider_value = lv_slider_get_value(id(progress_slider));

                    // Get media duration
                    float duration = 0;
                    if (id(ha_media_duration).has_state()) {
                      duration = id(ha_media_duration).state;
                    }

                    if (duration > 0) {
                      // Calculate target position in seconds
                      float target_position = (slider_value / 100.0) * duration;

                      // Update cached position immediately for smooth UI
                      id(cached_media_position) = target_position;
                      id(position_update_timestamp_ms) = millis();

                      ESP_LOGI("ui", "Seek requested to %.1f seconds (%.0f%%)", target_position, slider_value);
                    }
                - homeassistant.service:
                    service: media_player.media_seek
                    data:
                      entity_id: media_player.lards_speaker2
                    data_template:
                      seek_position: !lambda |-
                        float slider_value = lv_slider_get_value(id(progress_slider));
                        float duration = 0;
                        if (id(ha_media_duration).has_state()) {
                          duration = id(ha_media_duration).state;
                        }
                        return (slider_value / 100.0) * duration;

        # ---------------------------------------------------------------------
        # Playback Control Buttons (Right Panel - Horizontal Row)
        # ---------------------------------------------------------------------
        # Previous Track Button
        - button:
            id: btn_prev
            styles: style_btn_secondary
            width: 44
            height: 44
            align: TOP_LEFT
            x: 148
            y: 128
            on_click:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Previous button pressed"
                - homeassistant.service:
                    service: media_player.media_previous_track
                    data:
                      entity_id: media_player.lards_speaker2
            widgets:
              - label:
                  text: "\U000F04AD"
                  text_font: icons_24
                  text_color: 0xFFFFFF
                  align: CENTER

        # Play/Pause Button (Center)
        - button:
            id: btn_play
            styles: style_btn_primary
            width: 48
            height: 48
            align: TOP_LEFT
            x: 204
            y: 126
            on_click:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Play/Pause button pressed"
                - homeassistant.service:
                    service: media_player.media_play_pause
                    data:
                      entity_id: media_player.lards_speaker2
            widgets:
              - label:
                  id: lbl_play_icon
                  text: "\U000F040A"
                  text_font: icons_24
                  text_color: 0x121212
                  align: CENTER

        # Next Track Button
        - button:
            id: btn_next
            styles: style_btn_secondary
            width: 44
            height: 44
            align: TOP_LEFT
            x: 264
            y: 128
            on_click:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Next button pressed"
                - homeassistant.service:
                    service: media_player.media_next_track
                    data:
                      entity_id: media_player.lards_speaker2
            widgets:
              - label:
                  text: "\U000F04AE"
                  text_font: icons_24
                  text_color: 0xFFFFFF
                  align: CENTER

        # =====================================================================
        # BOTTOM AREA - VOLUME CONTROLS (Full Width)
        # =====================================================================

        # ---------------------------------------------------------------------
        # Volume Icon (Bottom Left)
        # ---------------------------------------------------------------------
        # Shows volume state icon: high, low, or mute based on volume level
        - label:
            id: lbl_volume_icon
            text: "\U000F057E"
            text_font: icons_24
            text_color: 0xB3B3B3
            align: BOTTOM_LEFT
            x: 8
            y: -6

        # ---------------------------------------------------------------------
        # Volume Slider (Bottom - Full Width)
        # ---------------------------------------------------------------------
        # Slim volume slider at very bottom spanning entire width
        # Only sends volume on release (debounced) to avoid flooding API
        - slider:
            id: slider_volume
            align: BOTTOM_LEFT
            x: 36
            y: -8
            width: 276
            height: 20
            min_value: 0
            max_value: 100
            value: 50
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 4
            indicator:
              bg_color: 0x00D1FF
              bg_opa: COVER
              radius: 4
            knob:
              bg_color: 0xFFFFFF
              bg_opa: COVER
              radius: 8
              width: 16
              height: 16
            on_release:
              then:
                - logger.log:
                    tag: "ui"
                    level: INFO
                    format: "Volume slider released: %d"
                    args: ['(int)x']
                - script.execute:
                    id: media_volume_set
                    volume_percent: !lambda 'return (int)x;'
                - lambda: |-
                    // Update volume icon based on level
                    int vol = (int)x;
                    if (vol == 0) {
                      lv_label_set_text(id(lbl_volume_icon), "\U000F0581");  // mute
                    } else if (vol < 50) {
                      lv_label_set_text(id(lbl_volume_icon), "\U000F0580");  // low
                    } else {
                      lv_label_set_text(id(lbl_volume_icon), "\U000F057E");  // high
                    }

# =============================================================================
# Dynamic Update Notes (Now Playing Screen)
# =============================================================================
# The following widget IDs are exposed for dynamic updates from state machine:
#
# - lbl_status: Update connection state text and color
#   Example: id(lbl_status).set_text("Disconnected");
#            id(lbl_status).set_style_text_color(lv_color_hex(0xFF6B35), 0);
#
# - lbl_title: Update with current track title from media player
#   Example: id(lbl_title).set_text(title.c_str());
#
# - lbl_artist: Update with current artist name from media player
#   Example: id(lbl_artist).set_text(artist.c_str());
#
# - lbl_album: Update with current album name from media player
#   Example: id(lbl_album).set_text(album.c_str());
#
# - btn_play: Access play button for visual state updates
#
# - lbl_play_icon: Toggle between play/pause icons based on playback state
#   Playing: id(lbl_play_icon).set_text("\U000F03E4");  // mdi:pause
#   Paused:  id(lbl_play_icon).set_text("\U000F040A");  // mdi:play
#
# - btn_prev / btn_next: Access for enabling/disabling based on playlist position
#
# Progress Bar Section:
# - progress_slider: Progress slider (0-100%), touch-to-seek enabled
#   Updated automatically via interval in media_player.yaml
#   On touch release, calls media_player.media_seek to seek to position
#   Example: lv_slider_set_value(id(progress_slider), percent, LV_ANIM_OFF);
#
# - lbl_elapsed_time: Elapsed time label (MM:SS format)
#   Updated automatically via interval in media_player.yaml
#   Example: lv_label_set_text(id(lbl_elapsed_time), "2:45");
#
# - lbl_total_time: Total duration label (MM:SS format)
#   Updated automatically via interval in media_player.yaml
#   Example: lv_label_set_text(id(lbl_total_time), "4:30");
#
# Volume Section:
# - slider_volume: Volume slider (0-100), calls media_volume_set on release
#   Example: lv_slider_set_value(id(slider_volume), volume_percent, LV_ANIM_ON);
#
# - lbl_volume_icon: Volume icon that changes based on level
#   Mute:    lv_label_set_text(id(lbl_volume_icon), "\U000F0581");  // mdi:volume-mute
#   Low:     lv_label_set_text(id(lbl_volume_icon), "\U000F0580");  // mdi:volume-low
#   High:    lv_label_set_text(id(lbl_volume_icon), "\U000F057E");  // mdi:volume-high
#
# Media Player Entity:
# The buttons call services on "media_player.lards_speaker2" entity.
# Update this entity_id to match your actual Home Assistant media player entity.
# =============================================================================

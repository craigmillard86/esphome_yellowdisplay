# =============================================================================
# Home Assistant Services - Settings Control from HA
# =============================================================================
# NOTE: Services are defined in main.yaml api: section to avoid duplicate
# component declarations. The following services are available:
#   - set_debug_mode(enabled: bool) - Toggle debug mode
#   - reset_settings() - Reset all settings to defaults

# =============================================================================
# Boot Initialization (T122)
# =============================================================================

esphome:
  on_boot:
    priority: 550  # After idle.yaml (600) but before UI
    then:
      - delay: 100ms  # Brief delay to let idle.yaml initialize
      - script.execute: load_settings

# =============================================================================
# Usage Notes
# =============================================================================
#
# SETTINGS PERSISTENCE:
#   All settings are automatically persisted to NVS via restore_value: yes.
#   NVS writes occur when the global value changes, with a write interval
#   controlled by the preferences: flash_write_interval setting in main.yaml.
#
# LOADING SETTINGS:
#   Settings are automatically loaded on boot via the load_settings script.
#   No manual intervention required.
#
# CHANGING SETTINGS:
#   Brightness and timeout settings are managed via Number entities from idle.yaml:
#     - number.num_brightness_level (10-100%)
#     - number.num_idle_dim_timeout (0-600 seconds)
#     - number.num_screen_off_timeout (0-1800 seconds)
#
#   Debug mode can be changed via:
#     - script.execute: set_debug_mode with parameter enabled
#
#   Example from lambda:
#     id(set_debug_mode).execute(true);
#
#   Example from Home Assistant service:
#     service: esphome.cyd_music_remote_set_debug_mode
#     data:
#       enabled: true
#
# RESET TO DEFAULTS:
#   Call reset_settings script or use Home Assistant service:
#     service: esphome.cyd_music_remote_reset_settings
#
# HOME ASSISTANT INTEGRATION:
#   Settings are exposed as entities in Home Assistant:
#     - number.cyd_music_remote_brightness_level (from idle.yaml)
#     - number.cyd_music_remote_idle_dim_timeout (from idle.yaml)
#     - number.cyd_music_remote_screen_off_timeout (from idle.yaml)
#     - binary_sensor.cyd_music_remote_debug_mode
#     - text_sensor.cyd_music_remote_settings_status
#     - sensor.cyd_music_remote_idle_time (from idle.yaml)
#     - text_sensor.cyd_music_remote_idle_state (from idle.yaml)
#
# INTEGRATION WITH IDLE.YAML:
#   This package works with the existing idle.yaml package which provides:
#   - Automatic screen dimming and turn-off based on idle time
#   - Touch event handling via reset_idle_timer script
#   - Number entities for brightness and timeout configuration
#
#   To integrate with touch events, call from your touch handlers:
#     - script.execute: reset_idle_timer
#
# =============================================================================

# =============================================================================
# Package: Wi-Fi Connection Management
# Purpose: Network connectivity with timeout handling and fallback AP mode
# Dependencies: None (hardware-level package)
# Exposes: wifi component with connection management and event logging
# =============================================================================

wifi:
  # Network credentials from secrets
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fast connect optimization
  # Skips network scan on boot, connects to last known BSSID immediately
  # Reduces connection time from ~5s to ~1-2s on stable networks
  fast_connect: true

  # Output power configuration for stable connection
  # ESP32 default is 20dBm (100mW), reducing slightly can improve stability
  # Range: 8.5dBm to 20dBm
  output_power: 18dBm

  # Connection timeout handling
  # If connection fails after this timeout, activates fallback AP mode
  # Must be long enough for DHCP and authentication (typical: 15-30s)
  reboot_timeout: 0s  # Disabled - use manual_ip or fallback AP instead

  # Manual IP configuration (optional, uncomment for faster connection)
  # Eliminates DHCP negotiation time (~2-3s savings)
  # manual_ip:
  #   static_ip: !secret static_ip
  #   gateway: !secret gateway_ip
  #   subnet: !secret subnet_mask
  #   dns1: !secret dns1_ip
  #   dns2: !secret dns2_ip

  # Fallback Access Point mode
  # Activated when Wi-Fi connection fails or on first boot
  # Allows initial configuration or recovery via captive portal
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

  # Wi-Fi event logging
  # Provides visibility into connection state changes
  on_connect:
    - logger.log:
        tag: "wifi"
        level: INFO
        format: "Wi-Fi connected: SSID=%s, IP=%s, RSSI=%ddBm"
        args:
          - 'WiFi.SSID().c_str()'
          - 'WiFi.localIP().toString().c_str()'
          - 'WiFi.RSSI()'

  on_disconnect:
    - logger.log:
        tag: "wifi"
        level: WARN
        format: "Wi-Fi disconnected, attempting reconnection..."

# Captive Portal - DISABLED to save ~3KB heap
# Uncomment if you need to reconfigure WiFi via fallback AP
# captive_portal:

# =============================================================================
# Package: Player Manager (T060-T068)
# Purpose: Multi-player management for Music Assistant integration
# Dependencies: packages/media_player.yaml (active player state)
#               packages/homeassistant.yaml (HA API connection)
# Exposes: Player list management, selection, NVS persistence
# =============================================================================

# This package implements:
# - T060: Query Music Assistant for available players list
# - T061: Subscribe to player state updates
# - T064: Prevent selection of offline players (FR-034)
# - T066: Persist selected player ID to NVS
# - T067: Restore selected player on boot from NVS
# - T068: Handle deleted/unavailable player - prompt re-selection
#
# DYNAMIC PLAYER DISCOVERY:
# Players are automatically discovered via Home Assistant REST API (/api/states).
# Discovery runs on boot and every 60 seconds (configurable via player_discovery_interval).
# Requires a Long-Lived Access Token configured in secrets.yaml (ha_long_lived_token).

# =============================================================================
# Substitutions
# =============================================================================

substitutions:
  # Maximum number of players to track (memory constraint)
  max_players: "8"

  # Player state poll interval
  player_state_poll_interval: "5s"

  # NVS namespace for player data
  player_nvs_namespace: "player"

  # Home Assistant REST API configuration for player discovery
  ha_api_url: !secret ha_url
  ha_api_token: !secret ha_long_lived_token

  # Player discovery interval (1 minute)
  player_discovery_interval: "60s"

# =============================================================================
# Global Variables - Player State Management
# =============================================================================

globals:
  # Currently selected player entity_id (persisted to NVS)
  # Format: "media_player.living_room_speaker"
  - id: selected_player_id
    type: std::string
    restore_value: yes  # Restore from NVS on boot (T067)
    max_restore_data_length: 64  # Entity IDs are typically ~50 chars
    initial_value: '""'

  # Selected player friendly name (for UI display)
  - id: selected_player_name
    type: std::string
    restore_value: no
    initial_value: '"No Player Selected"'

  # Selected player online status
  - id: selected_player_online
    type: bool
    restore_value: no
    initial_value: 'false'

  # Flag: Player selection prompt needed (T068)
  # Set when selected player becomes unavailable
  - id: player_selection_required
    type: bool
    restore_value: no
    initial_value: 'false'

  # Total count of available players
  - id: available_player_count
    type: int
    restore_value: no
    initial_value: '0'

  # Online player count (for UI display)
  - id: online_player_count
    type: int
    restore_value: no
    initial_value: '0'

  # Player data arrays (up to max_players entries)
  # Each player has: entity_id, friendly_name, is_online, volume_level

  # Player 0
  - id: player_0_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_0_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_0_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_0_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 1
  - id: player_1_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_1_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_1_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_1_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 2
  - id: player_2_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_2_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_2_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_2_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 3
  - id: player_3_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_3_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_3_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_3_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 4
  - id: player_4_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_4_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_4_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_4_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 5
  - id: player_5_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_5_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_5_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_5_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 6
  - id: player_6_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_6_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_6_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_6_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Player 7
  - id: player_7_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_7_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: player_7_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: player_7_volume
    type: int
    restore_value: no
    initial_value: '50'

  # Last button press timestamp for debouncing
  - id: last_player_select_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# =============================================================================
# Text Sensors - Player Display Information
# =============================================================================

text_sensor:
  # Selected player display name (for header/UI)
  - platform: template
    id: selected_player_display
    name: "Selected Player"
    icon: "mdi:speaker"
    update_interval: never
    lambda: |-
      return {id(selected_player_name)};

  # Player count display
  - platform: template
    id: player_count_display
    name: "Available Players"
    icon: "mdi:speaker-multiple"
    update_interval: 10s
    lambda: |-
      char buf[32];
      snprintf(buf, sizeof(buf), "%d online / %d total",
               id(online_player_count), id(available_player_count));
      return {buf};

  # ==========================================================================
  # Dynamic Player Discovery via Home Assistant REST API
  # ==========================================================================
  # Players are discovered automatically by querying HA's /api/states endpoint.
  # Discovery runs on boot and every ${player_discovery_interval} (default 60s).
  # Static subscriptions have been replaced with dynamic discovery.

# =============================================================================
# Scripts - Player Management (T060, T063, T064, T066-T068)
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  # Initialize Player Manager (T067)
  # ---------------------------------------------------------------------------
  # Called on boot to restore selected player and validate availability
  # Note: This script waits for HA API connection before proceeding
  - id: player_manager_init
    mode: single
    then:
      - lambda: |-
          // Check if Home Assistant API is connected before proceeding (C3 - race condition fix)
          if (!id(ha_api_connected).state) {
            ESP_LOGW("player_mgr", "HA API not connected yet, deferring init...");
            return;
          }
          ESP_LOGI("player_mgr", "Initializing player manager...");

          // Check if we have a persisted player selection
          std::string saved_id = id(selected_player_id);
          if (!saved_id.empty()) {
            ESP_LOGI("player_mgr", "Restored selected player from NVS: %s", saved_id.c_str());

            // Update active player in media_player package
            id(active_player_entity) = saved_id;
            // Hide "No Player Selected" overlay
            lv_obj_add_flag(id(no_player_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            ESP_LOGI("player_mgr", "No saved player selection found");
            id(player_selection_required) = true;
            // Show "No Player Selected" overlay
            lv_obj_clear_flag(id(no_player_overlay), LV_OBJ_FLAG_HIDDEN);
          }

      # Request player list update from HA
      - script.execute: refresh_player_list

  # ---------------------------------------------------------------------------
  # Refresh Player List (T060)
  # ---------------------------------------------------------------------------
  # Queries Home Assistant for available media players
  # Uses HA service call to get player list
  - id: refresh_player_list
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("player_mgr", "Refreshing player list from Home Assistant...");

      # Call HA to get media_player entities via event
      # Note: In production, this would use a custom service or sensor
      # For now, we populate from hardcoded entities in text_sensor subscriptions

      - delay: 500ms

      - lambda: |-
          // Count available and online players
          int available = 0;
          int online = 0;

          // Check each player slot
          if (!id(player_0_entity_id).empty()) { available++; if (id(player_0_online)) online++; }
          if (!id(player_1_entity_id).empty()) { available++; if (id(player_1_online)) online++; }
          if (!id(player_2_entity_id).empty()) { available++; if (id(player_2_online)) online++; }
          if (!id(player_3_entity_id).empty()) { available++; if (id(player_3_online)) online++; }
          if (!id(player_4_entity_id).empty()) { available++; if (id(player_4_online)) online++; }
          if (!id(player_5_entity_id).empty()) { available++; if (id(player_5_online)) online++; }
          if (!id(player_6_entity_id).empty()) { available++; if (id(player_6_online)) online++; }
          if (!id(player_7_entity_id).empty()) { available++; if (id(player_7_online)) online++; }

          id(available_player_count) = available;
          id(online_player_count) = online;

          ESP_LOGI("player_mgr", "Player list updated: %d available, %d online", available, online);

      - component.update: player_count_display

  # ---------------------------------------------------------------------------
  # Select Player (T063, T064, T066)
  # ---------------------------------------------------------------------------
  # Selects a player by index (0-7)
  # Validates player is online before selection (FR-034)
  # Persists selection to NVS (T066)
  - id: select_player
    mode: single
    parameters:
      player_index: int
    then:
      - lambda: |-
          // Debounce check (200ms) - use signed difference to handle millis() overflow
          uint32_t now = millis();
          int32_t elapsed = (int32_t)(now - id(last_player_select_ms));
          if (elapsed >= 0 && elapsed < 200) {
            ESP_LOGD("player_mgr", "Player select debounced");
            return;
          }
          id(last_player_select_ms) = now;

          // Get player data by index
          std::string entity_id;
          std::string name;
          bool is_online = false;

          switch (player_index) {
            case 0:
              entity_id = id(player_0_entity_id);
              name = id(player_0_name);
              is_online = id(player_0_online);
              break;
            case 1:
              entity_id = id(player_1_entity_id);
              name = id(player_1_name);
              is_online = id(player_1_online);
              break;
            case 2:
              entity_id = id(player_2_entity_id);
              name = id(player_2_name);
              is_online = id(player_2_online);
              break;
            case 3:
              entity_id = id(player_3_entity_id);
              name = id(player_3_name);
              is_online = id(player_3_online);
              break;
            case 4:
              entity_id = id(player_4_entity_id);
              name = id(player_4_name);
              is_online = id(player_4_online);
              break;
            case 5:
              entity_id = id(player_5_entity_id);
              name = id(player_5_name);
              is_online = id(player_5_online);
              break;
            case 6:
              entity_id = id(player_6_entity_id);
              name = id(player_6_name);
              is_online = id(player_6_online);
              break;
            case 7:
              entity_id = id(player_7_entity_id);
              name = id(player_7_name);
              is_online = id(player_7_online);
              break;
            default:
              ESP_LOGE("player_mgr", "Invalid player index: %d", player_index);
              return;
          }

          // Validate player exists
          if (entity_id.empty()) {
            ESP_LOGW("player_mgr", "Player slot %d is empty", player_index);
            return;
          }

          // Toggle selection: if tapping already selected player, unselect it
          if (entity_id == id(selected_player_id)) {
            ESP_LOGI("player_mgr", "Unselecting player: %s", name.c_str());
            id(selected_player_id) = "";
            id(selected_player_name) = "No Player Selected";
            id(selected_player_online) = false;
            id(player_selection_required) = true;
            id(active_player_entity) = "";
            // Show "No Player Selected" overlay
            lv_obj_clear_flag(id(no_player_overlay), LV_OBJ_FLAG_HIDDEN);
            // Update UI
            id(update_player_rows).execute();
            id(update_header_player_name).execute();
            return;
          }

          // FR-034: Prevent selection of offline players
          if (!is_online) {
            ESP_LOGW("player_mgr", "Cannot select offline player: %s", name.c_str());
            // Brief visual feedback - flash the row border red
            lv_obj_t* row = nullptr;
            switch (player_index) {
              case 0: row = id(player_row_0); break;
              case 1: row = id(player_row_1); break;
              case 2: row = id(player_row_2); break;
              case 3: row = id(player_row_3); break;
            }
            if (row != nullptr) {
              // Flash border to indicate cannot select
              lv_obj_set_style_border_color(row, lv_color_hex(0xFF6B35), 0);  // Orange/warning
              lv_obj_set_style_border_width(row, 2, 0);
            }
            return;
          }

          ESP_LOGI("player_mgr", "Selecting player %d: %s (%s)",
                   player_index, name.c_str(), entity_id.c_str());

          // Update selected player state
          id(selected_player_id) = entity_id;
          id(selected_player_name) = name;
          id(selected_player_online) = is_online;
          id(player_selection_required) = false;

          // Update active player in media_player package
          id(active_player_entity) = entity_id;

      - component.update: selected_player_display

      # Update header with new player name (T065)
      - script.execute: update_header_player_name

      # Update player rows UI to show new selection indicator (tick)
      - script.execute: update_player_rows

      # Request fresh state from the newly selected player
      - script.execute: request_player_state_refresh

      # Hide "No Player Selected" overlay on Now Playing screen
      - lvgl.widget.hide: no_player_overlay

      - logger.log:
          tag: "player_mgr"
          level: INFO
          format: "Player selection complete"

  # ---------------------------------------------------------------------------
  # Check Selected Player Availability (T068)
  # ---------------------------------------------------------------------------
  # Called periodically to verify selected player is still available
  # If unavailable, sets flag for re-selection prompt
  - id: check_selected_player
    mode: single
    then:
      - lambda: |-
          std::string current_id = id(selected_player_id);

          if (current_id.empty()) {
            // No player selected - require selection
            if (!id(player_selection_required)) {
              ESP_LOGW("player_mgr", "No player selected - prompting for selection");
              id(player_selection_required) = true;
              // Show "No Player Selected" overlay
              lv_obj_clear_flag(id(no_player_overlay), LV_OBJ_FLAG_HIDDEN);
            }
            return;
          }

          // Find current player in list and check status
          bool found = false;
          bool online = false;
          std::string name;

          // Check each slot
          if (id(player_0_entity_id) == current_id) {
            found = true; online = id(player_0_online); name = id(player_0_name);
          } else if (id(player_1_entity_id) == current_id) {
            found = true; online = id(player_1_online); name = id(player_1_name);
          } else if (id(player_2_entity_id) == current_id) {
            found = true; online = id(player_2_online); name = id(player_2_name);
          } else if (id(player_3_entity_id) == current_id) {
            found = true; online = id(player_3_online); name = id(player_3_name);
          } else if (id(player_4_entity_id) == current_id) {
            found = true; online = id(player_4_online); name = id(player_4_name);
          } else if (id(player_5_entity_id) == current_id) {
            found = true; online = id(player_5_online); name = id(player_5_name);
          } else if (id(player_6_entity_id) == current_id) {
            found = true; online = id(player_6_online); name = id(player_6_name);
          } else if (id(player_7_entity_id) == current_id) {
            found = true; online = id(player_7_online); name = id(player_7_name);
          }

          if (!found) {
            // Player was deleted/removed from HA
            ESP_LOGW("player_mgr", "Selected player no longer exists: %s", current_id.c_str());
            id(selected_player_id) = "";
            id(selected_player_name) = "Player Unavailable";
            id(selected_player_online) = false;
            id(player_selection_required) = true;
            // Show "No Player Selected" overlay
            lv_obj_clear_flag(id(no_player_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            // Update cached state
            id(selected_player_name) = name;
            id(selected_player_online) = online;

            if (!online && !id(player_selection_required)) {
              ESP_LOGW("player_mgr", "Selected player went offline: %s", name.c_str());
              // Don't force re-selection immediately, player may come back
            }
          }

      - component.update: selected_player_display

  # ---------------------------------------------------------------------------
  # Set Player Power (T059)
  # ---------------------------------------------------------------------------
  # Turns a player on or off
  - id: set_player_power
    mode: restart
    parameters:
      player_index: int
      power_on: bool
    then:
      - lambda: |-
          std::string entity_id;

          switch (player_index) {
            case 0: entity_id = id(player_0_entity_id); break;
            case 1: entity_id = id(player_1_entity_id); break;
            case 2: entity_id = id(player_2_entity_id); break;
            case 3: entity_id = id(player_3_entity_id); break;
            case 4: entity_id = id(player_4_entity_id); break;
            case 5: entity_id = id(player_5_entity_id); break;
            case 6: entity_id = id(player_6_entity_id); break;
            case 7: entity_id = id(player_7_entity_id); break;
            default: return;
          }

          if (entity_id.empty()) return;

          ESP_LOGI("player_mgr", "Setting player %d power: %s", player_index, power_on ? "ON" : "OFF");

      - if:
          condition:
            lambda: 'return power_on;'
          then:
            - homeassistant.service:
                service: media_player.turn_on
                data:
                  entity_id: !lambda |-
                    switch (player_index) {
                      case 0: return id(player_0_entity_id);
                      case 1: return id(player_1_entity_id);
                      case 2: return id(player_2_entity_id);
                      case 3: return id(player_3_entity_id);
                      case 4: return id(player_4_entity_id);
                      case 5: return id(player_5_entity_id);
                      case 6: return id(player_6_entity_id);
                      case 7: return id(player_7_entity_id);
                      default: return std::string("");
                    }
          else:
            - homeassistant.service:
                service: media_player.turn_off
                data:
                  entity_id: !lambda |-
                    switch (player_index) {
                      case 0: return id(player_0_entity_id);
                      case 1: return id(player_1_entity_id);
                      case 2: return id(player_2_entity_id);
                      case 3: return id(player_3_entity_id);
                      case 4: return id(player_4_entity_id);
                      case 5: return id(player_5_entity_id);
                      case 6: return id(player_6_entity_id);
                      case 7: return id(player_7_entity_id);
                      default: return std::string("");
                    }

  # ---------------------------------------------------------------------------
  # Set Player Volume (T058)
  # ---------------------------------------------------------------------------
  # Sets volume for a specific player
  - id: set_player_volume
    mode: restart
    parameters:
      player_index: int
      volume_percent: int
    then:
      - lambda: |-
          std::string entity_id;

          switch (player_index) {
            case 0: entity_id = id(player_0_entity_id); id(player_0_volume) = volume_percent; break;
            case 1: entity_id = id(player_1_entity_id); id(player_1_volume) = volume_percent; break;
            case 2: entity_id = id(player_2_entity_id); id(player_2_volume) = volume_percent; break;
            case 3: entity_id = id(player_3_entity_id); id(player_3_volume) = volume_percent; break;
            case 4: entity_id = id(player_4_entity_id); id(player_4_volume) = volume_percent; break;
            case 5: entity_id = id(player_5_entity_id); id(player_5_volume) = volume_percent; break;
            case 6: entity_id = id(player_6_entity_id); id(player_6_volume) = volume_percent; break;
            case 7: entity_id = id(player_7_entity_id); id(player_7_volume) = volume_percent; break;
            default: return;
          }

          if (entity_id.empty()) return;

          ESP_LOGI("player_mgr", "Setting player %d volume: %d%%", player_index, volume_percent);

      - homeassistant.service:
          service: media_player.volume_set
          data:
            entity_id: !lambda |-
              switch (player_index) {
                case 0: return id(player_0_entity_id);
                case 1: return id(player_1_entity_id);
                case 2: return id(player_2_entity_id);
                case 3: return id(player_3_entity_id);
                case 4: return id(player_4_entity_id);
                case 5: return id(player_5_entity_id);
                case 6: return id(player_6_entity_id);
                case 7: return id(player_7_entity_id);
                default: return std::string("");
              }
            volume_level: !lambda 'return volume_percent / 100.0f;'

  # ---------------------------------------------------------------------------
  # Register Player (T060)
  # ---------------------------------------------------------------------------
  # Adds a player to the list (called from HA sensor subscriptions)
  - id: register_player
    mode: queued
    parameters:
      slot: int
      entity_id: string
      name: string
      is_online: bool
      volume: int
    then:
      - lambda: |-
          if (slot < 0 || slot >= ${max_players}) {
            ESP_LOGE("player_mgr", "Invalid player slot: %d", slot);
            return;
          }

          ESP_LOGD("player_mgr", "Registering player %d: %s (%s) - %s",
                   slot, name.c_str(), entity_id.c_str(),
                   is_online ? "online" : "offline");

          switch (slot) {
            case 0:
              id(player_0_entity_id) = entity_id;
              id(player_0_name) = name;
              id(player_0_online) = is_online;
              id(player_0_volume) = volume;
              break;
            case 1:
              id(player_1_entity_id) = entity_id;
              id(player_1_name) = name;
              id(player_1_online) = is_online;
              id(player_1_volume) = volume;
              break;
            case 2:
              id(player_2_entity_id) = entity_id;
              id(player_2_name) = name;
              id(player_2_online) = is_online;
              id(player_2_volume) = volume;
              break;
            case 3:
              id(player_3_entity_id) = entity_id;
              id(player_3_name) = name;
              id(player_3_online) = is_online;
              id(player_3_volume) = volume;
              break;
            case 4:
              id(player_4_entity_id) = entity_id;
              id(player_4_name) = name;
              id(player_4_online) = is_online;
              id(player_4_volume) = volume;
              break;
            case 5:
              id(player_5_entity_id) = entity_id;
              id(player_5_name) = name;
              id(player_5_online) = is_online;
              id(player_5_volume) = volume;
              break;
            case 6:
              id(player_6_entity_id) = entity_id;
              id(player_6_name) = name;
              id(player_6_online) = is_online;
              id(player_6_volume) = volume;
              break;
            case 7:
              id(player_7_entity_id) = entity_id;
              id(player_7_name) = name;
              id(player_7_online) = is_online;
              id(player_7_volume) = volume;
              break;
          }

      # Update counts
      - script.execute: refresh_player_list

  # ---------------------------------------------------------------------------
  # Update Player UI (called when players screen is shown)
  # ---------------------------------------------------------------------------
  - id: update_players_ui
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("player_mgr", "Updating players UI...");
          // Note: Actual UI updates handled by update_player_rows in players.yaml
          // Header updates handled by update_header_player_name in header.yaml
      - script.execute: update_header_player_name

  # ---------------------------------------------------------------------------
  # Request Player State Refresh
  # ---------------------------------------------------------------------------
  # Called when switching players to fetch current state from HA REST API
  # Updates the Now Playing screen with the new player's current track info
  - id: request_player_state_refresh
    mode: restart
    then:
      - lambda: |-
          std::string entity = id(selected_player_id);
          if (entity.empty()) {
            ESP_LOGW("player_mgr", "No player selected, skipping state refresh");
            return;
          }
          ESP_LOGI("player_mgr", "Requesting state refresh for: %s", entity.c_str());

          // Clear current track display to show we're loading
          lv_obj_t* title_lbl = id(lbl_title);
          lv_obj_t* artist_lbl = id(lbl_artist);
          lv_obj_t* album_lbl = id(lbl_album);

          if (title_lbl != nullptr) lv_label_set_text(title_lbl, "Loading...");
          if (artist_lbl != nullptr) lv_label_set_text(artist_lbl, "");
          if (album_lbl != nullptr) lv_label_set_text(album_lbl, "");

      # Query HA for the selected player's current state via REST API
      - http_request.post:
          url: "${ha_api_url}/api/template"
          request_headers:
            Authorization: "Bearer ${ha_api_token}"
            Content-Type: "application/json"
          json: |-
            root["template"] = "{% set p = states('" + id(selected_player_id) + "') %}{% set a = state_attr('" + id(selected_player_id) + "', 'media_title') | default('') %}{% set b = state_attr('" + id(selected_player_id) + "', 'media_artist') | default('') %}{% set c = state_attr('" + id(selected_player_id) + "', 'media_album_name') | default('') %}{% set v = state_attr('" + id(selected_player_id) + "', 'volume_level') | default(0.5) %}{% set d = state_attr('" + id(selected_player_id) + "', 'media_duration') | default(0) %}{% set e = state_attr('" + id(selected_player_id) + "', 'media_position') | default(0) %}{\"state\":\"{{ p }}\",\"title\":\"{{ a }}\",\"artist\":\"{{ b }}\",\"album\":\"{{ c }}\",\"volume\":{{ v }},\"duration\":{{ d }},\"position\":{{ e }}}";
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGE("player_mgr", "State refresh failed: HTTP %d", response->status_code);
                    return;
                  }

                  // Read response body
                  size_t to_read = response->content_length;
                  if (to_read == 0 || to_read > 2048) to_read = 2048;

                  std::string body;
                  body.resize(to_read);
                  int bytes_read = response->read((uint8_t*)body.data(), to_read);
                  if (bytes_read <= 0) {
                    ESP_LOGE("player_mgr", "Failed to read state response");
                    return;
                  }
                  body.resize(bytes_read);

                  ESP_LOGI("player_mgr", "State refresh response: %s", body.c_str());

                  // Parse JSON: {"state":"playing","title":"...","artist":"...","album":"...","volume":0.5,"duration":180,"position":30}
                  auto extract_string = [&body](const char* key) -> std::string {
                    std::string search = std::string("\"") + key + "\":\"";
                    size_t pos = body.find(search);
                    if (pos == std::string::npos) return "";
                    size_t start = pos + search.length();
                    size_t end = body.find("\"", start);
                    if (end == std::string::npos) return "";
                    return body.substr(start, end - start);
                  };

                  auto extract_float = [&body](const char* key) -> float {
                    std::string search = std::string("\"") + key + "\":";
                    size_t pos = body.find(search);
                    if (pos == std::string::npos) return 0.0f;
                    size_t start = pos + search.length();
                    return atof(body.c_str() + start);
                  };

                  std::string state = extract_string("state");
                  std::string title = extract_string("title");
                  std::string artist = extract_string("artist");
                  std::string album = extract_string("album");
                  float volume = extract_float("volume");
                  float duration = extract_float("duration");
                  float position = extract_float("position");

                  ESP_LOGI("player_mgr", "Player state: %s, Title: %s, Artist: %s",
                           state.c_str(), title.c_str(), artist.c_str());

                  // Update display globals for album art lookup
                  id(current_display_artist) = artist;
                  id(current_display_title) = title;

                  // Update UI labels
                  lv_obj_t* title_lbl = id(lbl_title);
                  lv_obj_t* artist_lbl = id(lbl_artist);
                  lv_obj_t* album_lbl = id(lbl_album);

                  if (title_lbl != nullptr) {
                    lv_label_set_text(title_lbl, title.empty() ? "No Track" : title.c_str());
                  }
                  if (artist_lbl != nullptr) {
                    lv_label_set_text(artist_lbl, artist.c_str());
                  }
                  if (album_lbl != nullptr) {
                    lv_label_set_text(album_lbl, album.c_str());
                  }

                  // Update play/pause icon based on state
                  lv_obj_t* play_icon = id(lbl_play_icon);
                  if (play_icon != nullptr) {
                    if (state == "playing") {
                      lv_label_set_text(play_icon, "\U000F03E4");  // mdi:pause
                      id(optimistic_media_state) = 1;
                    } else {
                      lv_label_set_text(play_icon, "\U000F040A");  // mdi:play
                      id(optimistic_media_state) = state == "paused" ? 2 : 0;
                    }
                  }

                  // Update volume slider
                  int vol_pct = (int)(volume * 100);
                  lv_slider_set_value(id(slider_volume), vol_pct, LV_ANIM_OFF);
                  id(optimistic_volume) = volume;

                  // Update progress slider
                  id(cached_media_position) = position;
                  id(position_update_timestamp_ms) = millis();

                  if (duration > 0) {
                    int pct = (int)((position / duration) * 100);
                    lv_slider_set_value(id(progress_slider), pct, LV_ANIM_OFF);
                  }

                  // Update duration/position labels
                  {
                    int pos_sec = (int)position;
                    char buf[16];
                    snprintf(buf, sizeof(buf), "%d:%02d", pos_sec / 60, pos_sec % 60);
                    lv_label_set_text(id(lbl_elapsed_time), buf);
                  }

                  {
                    int dur_sec = (int)duration;
                    char buf[16];
                    snprintf(buf, sizeof(buf), "%d:%02d", dur_sec / 60, dur_sec % 60);
                    lv_label_set_text(id(lbl_total_time), buf);
                  }

                  ESP_LOGI("player_mgr", "Now Playing UI updated for new player");

              # Trigger album art lookup for the new player's track
              - script.execute: album_art_lookup

  # ---------------------------------------------------------------------------
  # Discover Players from Home Assistant REST API
  # ---------------------------------------------------------------------------
  # Queries HA /api/states endpoint to find all media_player entities
  # Called on boot and every ${player_discovery_interval} (default 60s)
  - id: discover_players
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("player_mgr", "Discovering players from HA REST API...");

      - http_request.post:
          url: "${ha_api_url}/api/template"
          request_headers:
            Authorization: "Bearer ${ha_api_token}"
            Content-Type: "application/json"
          json: |-
            root["template"] = "{% set players = states.media_player | selectattr('attributes.mass_player_type', 'defined') | list %}[{% for p in players %}{\"id\":\"{{ p.entity_id }}\",\"state\":\"{{ p.state }}\",\"name\":\"{{ p.attributes.friendly_name | default(p.entity_id) }}\"}{% if not loop.last %},{% endif %}{% endfor %}]";
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("player_mgr", "HA API response: HTTP %d, Content-Length: %d",
                           response->status_code, response->content_length);

                  if (response->status_code != 200) {
                    ESP_LOGE("player_mgr", "HA API error: HTTP %d", response->status_code);
                    return;
                  }

                  // Read response (should be small - just media_player entities)
                  size_t to_read = response->content_length;
                  if (to_read == 0 || to_read > 8192) {
                    to_read = 8192;
                  }

                  std::string body;
                  body.resize(to_read);
                  int total_read = response->read((uint8_t*)body.data(), to_read);

                  if (total_read <= 0) {
                    ESP_LOGE("player_mgr", "Failed to read response body");
                    return;
                  }
                  body.resize(total_read);

                  ESP_LOGI("player_mgr", "Read %d bytes: %.100s...", total_read, body.c_str());

                  // Clear all player slots before populating
                  id(player_0_entity_id) = ""; id(player_0_name) = ""; id(player_0_online) = false;
                  id(player_1_entity_id) = ""; id(player_1_name) = ""; id(player_1_online) = false;
                  id(player_2_entity_id) = ""; id(player_2_name) = ""; id(player_2_online) = false;
                  id(player_3_entity_id) = ""; id(player_3_name) = ""; id(player_3_online) = false;
                  id(player_4_entity_id) = ""; id(player_4_name) = ""; id(player_4_online) = false;
                  id(player_5_entity_id) = ""; id(player_5_name) = ""; id(player_5_online) = false;
                  id(player_6_entity_id) = ""; id(player_6_name) = ""; id(player_6_online) = false;
                  id(player_7_entity_id) = ""; id(player_7_name) = ""; id(player_7_online) = false;

                  int player_count = 0;
                  int online_count = 0;
                  size_t pos = 0;

                  // Parse compact JSON: [{"id":"media_player.x","state":"idle","name":"Name"},...]
                  while (player_count < ${max_players} && pos < body.length()) {
                    // Find next "id":"
                    size_t id_pos = body.find("\"id\":\"", pos);
                    if (id_pos == std::string::npos) break;

                    // Extract entity_id
                    size_t id_start = id_pos + 6;  // Skip "id":"
                    size_t id_end = body.find("\"", id_start);
                    if (id_end == std::string::npos) break;

                    std::string entity_id = body.substr(id_start, id_end - id_start);

                    // Find state
                    size_t state_pos = body.find("\"state\":\"", id_end);
                    if (state_pos == std::string::npos) {
                      pos = id_end + 1;
                      continue;
                    }

                    size_t state_start = state_pos + 9;
                    size_t state_end = body.find("\"", state_start);
                    if (state_end == std::string::npos) break;

                    std::string state = body.substr(state_start, state_end - state_start);
                    bool is_online = (state != "unavailable" && state != "unknown");

                    // Find name
                    std::string friendly_name = entity_id;
                    size_t name_pos = body.find("\"name\":\"", state_end);
                    if (name_pos != std::string::npos && name_pos < state_end + 100) {
                      size_t name_start = name_pos + 8;
                      size_t name_end = body.find("\"", name_start);
                      if (name_end != std::string::npos && name_end > name_start) {
                        friendly_name = body.substr(name_start, name_end - name_start);
                      }
                    }

                    ESP_LOGI("player_mgr", "Found player %d: %s (%s) - %s",
                             player_count, friendly_name.c_str(), entity_id.c_str(),
                             is_online ? "online" : "offline");

                    // Register player
                    switch (player_count) {
                      case 0:
                        id(player_0_entity_id) = entity_id;
                        id(player_0_name) = friendly_name;
                        id(player_0_online) = is_online;
                        break;
                      case 1:
                        id(player_1_entity_id) = entity_id;
                        id(player_1_name) = friendly_name;
                        id(player_1_online) = is_online;
                        break;
                      case 2:
                        id(player_2_entity_id) = entity_id;
                        id(player_2_name) = friendly_name;
                        id(player_2_online) = is_online;
                        break;
                      case 3:
                        id(player_3_entity_id) = entity_id;
                        id(player_3_name) = friendly_name;
                        id(player_3_online) = is_online;
                        break;
                      case 4:
                        id(player_4_entity_id) = entity_id;
                        id(player_4_name) = friendly_name;
                        id(player_4_online) = is_online;
                        break;
                      case 5:
                        id(player_5_entity_id) = entity_id;
                        id(player_5_name) = friendly_name;
                        id(player_5_online) = is_online;
                        break;
                      case 6:
                        id(player_6_entity_id) = entity_id;
                        id(player_6_name) = friendly_name;
                        id(player_6_online) = is_online;
                        break;
                      case 7:
                        id(player_7_entity_id) = entity_id;
                        id(player_7_name) = friendly_name;
                        id(player_7_online) = is_online;
                        break;
                    }

                    if (is_online) online_count++;
                    player_count++;
                    pos = state_end + 1;
                  }

                  // Update counts
                  id(available_player_count) = player_count;
                  id(online_player_count) = online_count;

                  ESP_LOGI("player_mgr", "Discovery complete: %d players found, %d online",
                           player_count, online_count);

                  if (player_count >= ${max_players}) {
                    ESP_LOGW("player_mgr", "Reached max player limit (%d), some players may not be shown",
                             ${max_players});
                  }

              - component.update: player_count_display

              # Check if selected player still exists after discovery
              - script.execute: check_selected_player

# =============================================================================
# Interval: Periodic Player State Check and Discovery
# =============================================================================

interval:
  # Check selected player availability periodically (T068)
  - interval: ${player_state_poll_interval}
    then:
      - script.execute: check_selected_player

  # Discover players from HA REST API periodically
  - interval: ${player_discovery_interval}
    then:
      - if:
          condition:
            lambda: 'return id(ha_api_connected).state;'
          then:
            - script.execute: discover_players

# =============================================================================
# Boot Initialization
# =============================================================================
# Note: Initialization is triggered by HA API connection event.
# This ensures players are only queried after the HA connection is established.
# The on_boot handler below is a fallback that waits for HA connection.

esphome:
  on_boot:
    priority: 100  # Run after most components init
    then:
      - delay: 5s  # Wait for HA connection attempt
      - if:
          condition:
            lambda: 'return id(ha_api_connected).state;'
          then:
            - script.execute: player_manager_init
          else:
            - logger.log:
                tag: "player_mgr"
                level: WARN
                format: "HA not connected at boot, init will retry when connected"

# Trigger init when HA API connects (H5 - player availability check after boot)
binary_sensor:
  - platform: template
    id: ha_api_init_trigger
    internal: true
    lambda: 'return id(ha_api_connected).state;'
    on_press:
      then:
        - delay: 1s  # Brief delay to let HA sync
        - script.execute: player_manager_init
        - delay: 500ms
        - script.execute: discover_players  # Discover players from HA REST API
        - delay: 2s  # Allow player list to populate
        - script.execute: check_selected_player  # Verify selected player availability (H5)

# =============================================================================
# Usage Notes
# =============================================================================
#
# DYNAMIC PLAYER DISCOVERY:
#   Players are automatically discovered from Home Assistant via REST API.
#   Discovery runs:
#   - On boot when HA API connects
#   - Every ${player_discovery_interval} (default 60 seconds)
#
# PREREQUISITES:
#   1. Generate a Long-Lived Access Token in Home Assistant:
#      Settings → Devices & Services → (your user profile) → Long-Lived Access Tokens
#   2. Add to esphome/secrets.yaml:
#      ha_url: "http://your-ha-ip:8123"
#      ha_long_lived_token: "your_token_here"
#
# Player Data Structure:
#   Each player slot (0-7) has the following globals:
#   - player_N_entity_id: Home Assistant entity ID
#   - player_N_name: Friendly name for display
#   - player_N_online: Current online/offline status
#   - player_N_volume: Current volume level (0-100)
#
# To manually register a player (optional, discovery handles this):
#   - script.execute:
#       id: register_player
#       slot: 0
#       entity_id: "media_player.living_room"
#       name: "Living Room"
#       is_online: true
#       volume: 50
#
# To select a player (will be persisted to NVS):
#   - script.execute:
#       id: select_player
#       player_index: 0
#
# To force a player discovery refresh:
#   - script.execute: discover_players
#
# The selected player ID persists across reboots via NVS restore_value.
#
# =============================================================================

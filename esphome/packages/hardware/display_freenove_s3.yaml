# =============================================================================
# Package: Display Configuration (Freenove ESP32-S3)
# Purpose: ILI9341 TFT display initialization
# Dependencies: packages/hardware/spi_freenove_s3.yaml (requires 'tft' spi)
# Exposes: display component 'main_display'
# Hardware: 240x320 ILI9341, configured for 320x240 landscape (rotation 90°)
# =============================================================================

display:
  - platform: ili9xxx
    id: main_display
    model: ${display_model}
    spi_id: tft
    cs_pin: ${display_cs}
    dc_pin: ${display_dc}
    rotation: 90
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false

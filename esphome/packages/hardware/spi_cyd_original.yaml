# =============================================================================
# Package: SPI Bus Configuration (Original CYD - ESP32-2432S028R)
# Purpose: Dual SPI bus initialization for display and touch
# Dependencies: Device file (devices/cyd_original.yaml)
# Exposes: spi components 'tft' and 'touch'
# Note: ESP32-2432S028R uses SEPARATE SPI buses for display and touch
# =============================================================================

spi:
  # SPI bus for ILI9341 TFT display
  # GPIO12 is a strapping pin on ESP32 - ignore warning as it's used for MISO
  - id: tft
    clk_pin: ${spi_tft_clk}
    mosi_pin: ${spi_tft_mosi}
    miso_pin:
      number: ${spi_tft_miso}
      ignore_strapping_warning: true

  # Separate SPI bus for XPT2046 touch controller
  - id: touch
    clk_pin: ${spi_touch_clk}
    mosi_pin: ${spi_touch_mosi}
    miso_pin: ${spi_touch_miso}

# =============================================================================
# Package: Display Configuration (Original CYD - ESP32-2432S028R)
# Purpose: ILI9341 TFT display initialization
# Dependencies: packages/hardware/spi_cyd_original.yaml (requires 'tft' spi)
# Exposes: display component 'main_display'
# Hardware: 240x320 ILI9341, configured for 320x240 landscape (rotation 90°)
# =============================================================================

display:
  - platform: ili9xxx
    id: main_display
    model: ${display_model}
    spi_id: tft
    cs_pin:
      number: ${display_cs}
      ignore_strapping_warning: true
    dc_pin:
      number: ${display_dc}
      ignore_strapping_warning: true
    rotation: 90
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

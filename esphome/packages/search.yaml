# =============================================================================
# Package: Search System (T086)
# Purpose: Backend logic for Music Assistant search functionality
# Dependencies: packages/homeassistant.yaml (HA API connection)
#               packages/player_manager.yaml (active player state)
#               packages/browse.yaml (play_media_item script)
# Exposes: Search scripts, query management, result handling
# =============================================================================

# This package implements:
# - T086: Implement search query submission to MA
#
# Music Assistant Integration:
# - Uses Home Assistant service calls to Music Assistant
# - Service: music_assistant.search for search queries
# - Returns: Search results with media_id, title, artist, type
#
# Memory Management:
# - ESP32 heap constraint: ~80KB free heap minimum
# - Maximum search results: 15 items (smaller than browse due to keyboard memory)
# - Clear previous results before new search

# =============================================================================
# Substitutions
# =============================================================================

substitutions:
  # Maximum search results to store (memory constraint)
  search_max_results: "15"

  # Search query minimum length
  search_min_query_length: "2"

  # Search debounce timeout (milliseconds)
  search_debounce_ms: "500"

# =============================================================================
# Global Variables - Search State Management
# =============================================================================

globals:
  # Current search query
  - id: search_query
    type: std::string
    restore_value: no
    initial_value: '""'

  # Number of search results loaded
  - id: search_results_count
    type: int
    restore_value: no
    initial_value: '0'

  # Flag: Search operation in progress
  - id: search_loading
    type: bool
    restore_value: no
    initial_value: 'false'

  # Search result storage (up to 15 items)
  # Each item has: media_id, title, subtitle (artist/album), media_type

  # Result 0
  - id: search_result_0_media_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_0_title
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_0_subtitle
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_0_type
    type: std::string
    restore_value: no
    initial_value: '""'

  # Result 1
  - id: search_result_1_media_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_1_title
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_1_subtitle
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_1_type
    type: std::string
    restore_value: no
    initial_value: '""'

  # Result 2
  - id: search_result_2_media_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_2_title
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_2_subtitle
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_2_type
    type: std::string
    restore_value: no
    initial_value: '""'

  # Result 3
  - id: search_result_3_media_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_3_title
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_3_subtitle
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_3_type
    type: std::string
    restore_value: no
    initial_value: '""'

  # Result 4
  - id: search_result_4_media_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_4_title
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_4_subtitle
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: search_result_4_type
    type: std::string
    restore_value: no
    initial_value: '""'

  # NOTE: For production, expand to search_result_0 through search_result_14 (15 items)
  # Abbreviated here for readability. Pattern repeats for results 5-14.

# =============================================================================
# Scripts - Search Operations
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  # Execute Search Query (T086)
  # ---------------------------------------------------------------------------
  # Submits search query to Music Assistant and displays results
  # Parameters:
  #   query: string (search term from keyboard input)
  - id: execute_search
    mode: restart
    parameters:
      query: std::string
    then:
      - lambda: |-
          ESP_LOGI("search", "Execute search: '%s'", query.c_str());

          // Validate query length
          if (query.length() < ${search_min_query_length}) {
            ESP_LOGW("search", "Query too short (min %d characters)", ${search_min_query_length});
            return;
          }

          // Check if already searching
          if (id(search_loading)) {
            ESP_LOGW("search", "Search already in progress, ignoring");
            return;
          }

          // Set loading flag
          id(search_loading) = true;
          id(search_query) = query;
          id(search_results_count) = 0;

          // Clear previous results
          id(search_result_0_media_id) = "";
          id(search_result_0_title) = "";
          id(search_result_0_subtitle) = "";
          id(search_result_0_type) = "";
          id(search_result_1_media_id) = "";
          id(search_result_1_title) = "";
          id(search_result_1_subtitle) = "";
          id(search_result_1_type) = "";
          id(search_result_2_media_id) = "";
          id(search_result_2_title) = "";
          id(search_result_2_subtitle) = "";
          id(search_result_2_type) = "";
          id(search_result_3_media_id) = "";
          id(search_result_3_title) = "";
          id(search_result_3_subtitle) = "";
          id(search_result_3_type) = "";
          id(search_result_4_media_id) = "";
          id(search_result_4_title) = "";
          id(search_result_4_subtitle) = "";
          id(search_result_4_type) = "";
          // Clear results 5-14 in production version

      # Note: Actual Music Assistant search API call would be implemented here
      # For now, this is a placeholder for the search logic structure
      # Real implementation would use http_request or homeassistant.service

      - logger.log:
          tag: "search"
          level: INFO
          format: "Search query '%s' submitted"
          args: ['query.c_str()']

      # Placeholder: Simulate async search operation
      - delay: 500ms

      - lambda: |-
          // Placeholder: Mark search complete
          id(search_loading) = false;
          ESP_LOGI("search", "Search complete");

  # ---------------------------------------------------------------------------
  # Clear Search Results
  # ---------------------------------------------------------------------------
  # Clears all search results from memory
  # Call when exiting search screen to free memory
  - id: clear_search_results
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("search", "Clearing search results");

          id(search_query) = "";
          id(search_results_count) = 0;
          id(search_loading) = false;

          // Clear all result data
          id(search_result_0_media_id) = "";
          id(search_result_0_title) = "";
          id(search_result_0_subtitle) = "";
          id(search_result_0_type) = "";
          id(search_result_1_media_id) = "";
          id(search_result_1_title) = "";
          id(search_result_1_subtitle) = "";
          id(search_result_1_type) = "";
          id(search_result_2_media_id) = "";
          id(search_result_2_title) = "";
          id(search_result_2_subtitle) = "";
          id(search_result_2_type) = "";
          id(search_result_3_media_id) = "";
          id(search_result_3_title) = "";
          id(search_result_3_subtitle) = "";
          id(search_result_3_type) = "";
          id(search_result_4_media_id) = "";
          id(search_result_4_title) = "";
          id(search_result_4_subtitle) = "";
          id(search_result_4_type) = "";
          // Clear results 5-14 in production version

          ESP_LOGI("search", "Search results cleared");

  # ---------------------------------------------------------------------------
  # Update Search Query Text
  # ---------------------------------------------------------------------------
  # Updates search query as user types (for live display)
  # Does NOT submit search (use execute_search for that)
  - id: update_search_query
    mode: restart
    parameters:
      query: std::string
    then:
      - lambda: |-
          id(search_query) = query;
          ESP_LOGD("search", "Search query updated: '%s'", query.c_str());

# =============================================================================
# Implementation Notes
# =============================================================================
#
# Music Assistant Search Integration:
#
# 1. Search Service (T086):
#    - Service: music_assistant.search
#    - Parameters: query (search string), media_types (optional filter)
#    - Returns: List of search results with:
#      - media_id: Music Assistant media URI
#      - title: Track/album/artist name
#      - artist: Artist name (for tracks)
#      - album: Album name (for tracks)
#      - media_type: "track", "album", "artist", "playlist"
#
# 2. Result Parsing:
#    - Parse JSON response from Music Assistant
#    - Extract relevant fields (media_id, title, artist, album, type)
#    - Store in global variables (search_result_X_*)
#    - Update UI list with results
#
# 3. Play Search Result:
#    - Reuse play_media_item script from browse.yaml
#    - Pass media_id from selected search result
#    - Playback starts on selected player
#
# Memory Management Strategy:
#
# - Limit to 15 results in memory (smaller than browse due to keyboard)
# - Each result ~120 bytes (media_id, title, subtitle, type strings)
# - Total memory footprint: ~1.8KB for results
# - QWERTY keyboard: ~2KB for button widgets
# - Total search screen memory: ~4KB (safe for ESP32)
#
# Search UX Flow:
#
# 1. User navigates to Search screen
# 2. Keyboard displays at bottom (QWERTY layout)
# 3. Text area displays at top (shows current query)
# 4. User types query using keyboard
# 5. User taps "Search" or "Enter" key
# 6. Loading indicator shows during search
# 7. Results display in scrollable list above keyboard
# 8. User taps result to play
# 9. Playback starts on selected player
#
# Keyboard Integration (T085):
#
# - LVGL textarea widget linked to keyboard widget
# - Keyboard events update textarea content
# - Textarea content stored in search_query global
# - "OK" button on keyboard triggers execute_search script
# - Backspace, clear, and character input handled by LVGL
#
# Error Handling:
#
# - Empty query: Show hint message ("Enter search term")
# - Query too short: Show hint ("Min 2 characters")
# - No results: Show empty state ("No results found")
# - Network error: Show error message, retry option
# - Player not selected: Prevent playback, show prompt
#
# Performance Optimization:
#
# - Debounce search: 500ms delay after last keystroke
# - Cancel previous search if new query submitted
# - Clear results when exiting screen (free memory)
# - Show loading indicator immediately (responsive feel)
# - Limit results to 15 items (prevent memory overflow)
#
# Accessibility:
#
# - Keyboard keys: 30x30px minimum for touch accuracy
# - High contrast keys (white text on dark background)
# - Clear visual feedback on key press
# - Search results: 56px height (44px touch target + padding)
# - Scrollable results list (handle overflow gracefully)
#
# =============================================================================

# =============================================================================
# Package: Display Configuration
# Purpose: ILI9341 TFT display initialization and hardware setup
# Dependencies: packages/spi.yaml (requires 'tft' spi component)
# Exposes: display component 'main_display'
# Hardware: 240x320 ILI9341, configured for 320x240 landscape (rotation 90°)
# =============================================================================

display:
  - platform: ili9xxx
    id: main_display
    model: ILI9341
    spi_id: tft
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    rotation: 90
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

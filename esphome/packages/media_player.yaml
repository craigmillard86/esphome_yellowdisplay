# =============================================================================
# Interval: Position Tracking Update
# =============================================================================

interval:
  # Periodically update media position display and progress bar UI
  # Only active interpolation happens in the sensor lambda
  - interval: ${media_position_poll_interval}
    then:
      - lambda: |-
          // Get current position and duration
          float position = 0;
          float duration = 0;

          // Calculate interpolated position if playing
          if (id(optimistic_media_state) == 1 && id(position_update_timestamp_ms) > 0) {
            float elapsed_seconds = (millis() - id(position_update_timestamp_ms)) / 1000.0;
            position = id(cached_media_position) + elapsed_seconds;
          } else {
            position = id(cached_media_position);
          }

          if (id(ha_media_duration).has_state()) {
            duration = id(ha_media_duration).state;
          }

          // Clamp position to duration
          if (duration > 0 && position > duration) {
            position = duration;
          }

          // Update progress slider (0-100%)
          int progress_percent = 0;
          if (duration > 0) {
            progress_percent = (int)((position / duration) * 100.0);
            if (progress_percent > 100) progress_percent = 100;
            if (progress_percent < 0) progress_percent = 0;
          }
          lv_slider_set_value(id(progress_slider), progress_percent, LV_ANIM_OFF);

          // Format elapsed time as MM:SS
          int elapsed_min = (int)position / 60;
          int elapsed_sec = (int)position % 60;
          char elapsed_str[8];
          snprintf(elapsed_str, sizeof(elapsed_str), "%d:%02d", elapsed_min, elapsed_sec);
          lv_label_set_text(id(lbl_elapsed_time), elapsed_str);

          // Format total time as MM:SS
          int total_min = (int)duration / 60;
          int total_sec = (int)duration % 60;
          char total_str[8];
          snprintf(total_str, sizeof(total_str), "%d:%02d", total_min, total_sec);
          lv_label_set_text(id(lbl_total_time), total_str);

# =============================================================================
# Notes on Usage
# =============================================================================
#
# To use this package in your main.yaml:
#
# packages:
#   media_player: !include packages/media_player.yaml
#
# To change the default media player, add this substitution in main.yaml:
#   substitutions:
#     default_media_player: "media_player.your_player_entity"
#
# To change the active player at runtime (e.g., from a UI action):
#   - script.execute:
#       id: set_active_player
#       player_entity_id: "media_player.other_player"
#
# Available scripts for UI integration:
#   - media_play           : Start playback
#   - media_pause          : Pause playback
#   - media_play_pause     : Toggle play/pause
#   - media_next_track     : Skip to next track
#   - media_previous_track : Go to previous track
#   - media_volume_set     : Set volume (0-100)
#   - media_volume_up      : Increase volume by 5%
#   - media_volume_down    : Decrease volume by 5%
#   - media_mute_toggle    : Toggle mute state
#   - set_active_player    : Change active player entity
#
# Available sensors for UI display:
#   - media_state_display    : Current playback state
#   - media_title_display    : Current track title
#   - media_artist_display   : Current track artist
#   - media_album_display    : Current track album
#   - media_position_display : Current position (seconds)
#   - media_duration_display : Track duration (seconds)
#   - volume_level_display   : Current volume (%)
#   - active_player_display  : Active player entity_id
#
# Binary sensors:
#   - media_is_playing     : True if currently playing
#   - media_is_paused      : True if currently paused
#   - ha_is_volume_muted   : True if volume is muted (from HA)
#
# Global variables:
#   - is_volume_muted      : Current mute state (bool)
#

# =============================================================================
# UI Screen: Favorites Browse List (T075, T080, T081, T088, T090)
# Purpose: Display favorited tracks synced from Music Assistant
# Dependencies: Same as browse_recent.yaml
# Exposes: page_browse_favorites LVGL page
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# Implementation: Same pattern as browse_recent.yaml
# - T075: Implement Favorites list view (synced from MA)
# - T080: Add loading indicator during content fetch
# - T081: Add empty state message for empty categories
# - T088: Add navigation breadcrumbs or back button
# - T090: Wire Favorites tile navigation from home (done in lvgl.yaml)

# For brevity, this is an abbreviated version.
# Full implementation follows the exact same pattern as browse_recent.yaml with:
# - Screen ID: page_browse_favorites
# - Category: 2 (FAVORITES)
# - Title: "Favorites"
# - Icon: \U000F02D1 (mdi:heart)
# - Empty state: "No Favorites" / "Star your favorite tracks in Music Assistant"

lvgl:
  pages:
    - id: page_browse_favorites
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      on_load:
        - logger.log:
            tag: "browse"
            level: INFO
            format: "Favorites screen loaded"
        # Show loading indicator, hide empty state and items
        - lambda: |-
            lv_obj_clear_flag(id(loading_indicator_favorites), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(empty_state_favorites), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(favorites_pagination_footer), LV_OBJ_FLAG_HIDDEN);
            // Hide all items initially

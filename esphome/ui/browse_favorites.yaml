            lv_obj_add_flag(id(favorites_item_8), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(favorites_item_9), LV_OBJ_FLAG_HIDDEN);
        # Load content
        - script.execute:
            id: browse_category
            category: 2  # FAVORITES
      widgets:
        # Header (same pattern as browse_recent)
        - button:
            id: btn_favorites_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0

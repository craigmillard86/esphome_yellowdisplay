# =============================================================================
# UI Screen: Device Settings - Full Interactive Version
# =============================================================================
# Full settings screen with interactive controls
# - Brightness slider
# - Dim timeout cycle button
# - Screen off timeout cycle button
# - Debug mode toggle
# =============================================================================

lvgl:
  pages:
    - id: page_settings
      bg_color: 0x121212
      widgets:
        # =====================================================================
        # HEADER (y=0-44)
        # =====================================================================

        # Back Button
        - button:
            id: btn_settings_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"  # mdi:arrow-left
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Title
        - label:
            text: "Settings"
            text_font: roboto_16
            text_color: 0xFFFFFF
            x: 48
            y: 12

        # Header divider
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0

        # =====================================================================
        # BRIGHTNESS SECTION (y=50-90)
        # =====================================================================

        - label:
            text: "Brightness"
            text_font: roboto_12
            text_color: 0xB3B3B3
            x: 12
            y: 54

        # Brightness value display
        - label:
            id: lbl_brightness_value
            text: "50%"
            text_font: roboto_12
            text_color: 0x00D1FF
            x: 280
            y: 54
            width: 36
            text_align: RIGHT

        # Brightness slider
        - slider:
            id: slider_brightness
            x: 12
            y: 72
            width: 296
            height: 16
            min_value: 10
            max_value: 100
            value: 50
            bg_color: 0x2A2A2A
            bg_opa: COVER
            radius: 8
            indicator:
              bg_color: 0x00D1FF
              bg_opa: COVER
              radius: 8
            knob:
              bg_color: 0xFFFFFF
              bg_opa: COVER
              radius: 10
              width: 20
              height: 20
            on_release:
              then:
                - lambda: |-
                    int brightness = (int)x;
                    ESP_LOGI("settings", "Brightness slider: %d%%", brightness);

                    // Update global setting
                    id(setting_brightness_level) = brightness / 100.0f;

                    // Update display label
                    char buf[8];
                    snprintf(buf, sizeof(buf), "%d%%", brightness);
                    lv_label_set_text(id(lbl_brightness_value), buf);

                    // Apply to backlight
                    auto call = id(backlight).turn_on();
                    call.set_brightness(id(setting_brightness_level));
                    call.perform();

                    // Update HA number entity
                    auto num_call = id(num_brightness_level).make_call();
                    num_call.set_value(brightness);
                    num_call.perform();

        # =====================================================================
        # DIM TIMEOUT SECTION (y=100-135)
        # =====================================================================

        - label:
            text: "Dim After"
            text_font: roboto_12
            text_color: 0xB3B3B3
            x: 12
            y: 108

        # Dim timeout button (cycles through presets)
        - button:
            id: btn_dim_timeout
            x: 200
            y: 100
            width: 108
            height: 32
            bg_color: 0x2A2A2A
            bg_opa: COVER
            radius: 6
            border_width: 1
            border_color: 0x3A3A3A
            shadow_width: 0
            on_click:
              - script.execute: settings_cycle_dim_timeout
            widgets:
              - label:
                  id: lbl_dim_timeout_value
                  text: "60 sec"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  align: CENTER

        # =====================================================================
        # SCREEN OFF SECTION (y=140-175)
        # =====================================================================

        - label:
            text: "Screen Off"
            text_font: roboto_12
            text_color: 0xB3B3B3
            x: 12
            y: 148

        # Screen off timeout button (cycles through presets)
        - button:
            id: btn_screen_off_timeout
            x: 200
            y: 140
            width: 108
            height: 32
            bg_color: 0x2A2A2A
            bg_opa: COVER
            radius: 6
            border_width: 1
            border_color: 0x3A3A3A
            shadow_width: 0
            on_click:
              - script.execute: settings_cycle_screen_off_timeout
            widgets:
              - label:
                  id: lbl_screen_off_value
                  text: "3 min"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  align: CENTER

        # =====================================================================
        # DEBUG MODE SECTION (y=180-215)
        # =====================================================================

        - label:
            text: "Debug Mode"
            text_font: roboto_12
            text_color: 0xB3B3B3
            x: 12
            y: 188

        # Debug mode toggle button
        - button:
            id: btn_debug_toggle
            x: 200
            y: 180
            width: 108
            height: 32
            bg_color: 0x2A2A2A
            bg_opa: COVER
            radius: 6
            border_width: 1
            border_color: 0x3A3A3A
            shadow_width: 0
            on_click:
              - script.execute: settings_toggle_debug_mode
            widgets:
              - label:
                  id: lbl_debug_value
                  text: "OFF"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  align: CENTER

        # Debug timer (shown when debug mode is ON)
        - label:
            id: lbl_debug_timer
            text: ""
            text_font: roboto_12
            text_color: 0x888888
            x: 12
            y: 210
            hidden: true

# =============================================================================
# Scripts - Settings UI Interactions
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  # Cycle Dim Timeout
  # ---------------------------------------------------------------------------
  # Cycles through: 30s -> 60s -> 120s -> 5min -> Never -> 30s...
  - id: settings_cycle_dim_timeout
    mode: restart
    then:
      - lambda: |-
          int current = id(setting_idle_dim_timeout);
          int next;
          const char* label;

          // Cycle through presets
          if (current == 0) {
            next = 30; label = "30 sec";
          } else if (current <= 30) {
            next = 60; label = "60 sec";
          } else if (current <= 60) {
            next = 120; label = "2 min";
          } else if (current <= 120) {
            next = 300; label = "5 min";
          } else {
            next = 0; label = "Never";
          }

          ESP_LOGI("settings", "Dim timeout: %d -> %d seconds", current, next);
          id(setting_idle_dim_timeout) = next;

          // Update UI
          lv_label_set_text(id(lbl_dim_timeout_value), label);

          // Update HA number entity
          auto call = id(num_idle_dim_timeout).make_call();
          call.set_value(next);
          call.perform();

  # ---------------------------------------------------------------------------
  # Cycle Screen Off Timeout
  # ---------------------------------------------------------------------------
  # Cycles through: 1min -> 3min -> 5min -> 10min -> Never -> 1min...
  - id: settings_cycle_screen_off_timeout
    mode: restart
    then:
      - lambda: |-
          int current = id(setting_screen_off_timeout);
          int next;
          const char* label;

          // Cycle through presets
          if (current == 0) {
            next = 60; label = "1 min";
          } else if (current <= 60) {
            next = 180; label = "3 min";
          } else if (current <= 180) {
            next = 300; label = "5 min";
          } else if (current <= 300) {
            next = 600; label = "10 min";
          } else {
            next = 0; label = "Never";
          }

          ESP_LOGI("settings", "Screen off timeout: %d -> %d seconds", current, next);
          id(setting_screen_off_timeout) = next;

          // Update UI
          lv_label_set_text(id(lbl_screen_off_value), label);

          // Update HA number entity
          auto call = id(num_screen_off_timeout).make_call();
          call.set_value(next);
          call.perform();

  # ---------------------------------------------------------------------------
  # Toggle Debug Mode
  # ---------------------------------------------------------------------------
  - id: settings_toggle_debug_mode
    mode: restart
    then:
      - lambda: |-
          bool current = id(setting_debug_mode_enabled);
          bool next = !current;

          ESP_LOGI("settings", "Debug mode: %s -> %s",
                   current ? "ON" : "OFF", next ? "ON" : "OFF");

          id(setting_debug_mode_enabled) = next;

          // Update UI
          if (next) {
            lv_label_set_text(id(lbl_debug_value), "ON");
            lv_obj_set_style_bg_color(id(btn_debug_toggle), lv_color_hex(0x00D1FF), 0);
            lv_obj_set_style_text_color(id(lbl_debug_value), lv_color_hex(0x121212), 0);
          } else {
            lv_label_set_text(id(lbl_debug_value), "OFF");
            lv_obj_set_style_bg_color(id(btn_debug_toggle), lv_color_hex(0x2A2A2A), 0);
            lv_obj_set_style_text_color(id(lbl_debug_value), lv_color_hex(0xFFFFFF), 0);
          }

      # Save settings
      - script.execute: save_settings

  # ---------------------------------------------------------------------------
  # Update Settings UI (called when navigating to settings screen)
  # ---------------------------------------------------------------------------
  - id: settings_update_ui
    mode: restart
    then:
      - lambda: |-
          // Update brightness slider and label
          int brightness_pct = (int)(id(setting_brightness_level) * 100.0f);
          lv_slider_set_value(id(slider_brightness), brightness_pct, LV_ANIM_OFF);

          char buf[16];
          snprintf(buf, sizeof(buf), "%d%%", brightness_pct);
          lv_label_set_text(id(lbl_brightness_value), buf);

          // Update dim timeout label
          int dim = id(setting_idle_dim_timeout);
          const char* dim_label;
          if (dim == 0) dim_label = "Never";
          else if (dim <= 30) dim_label = "30 sec";
          else if (dim <= 60) dim_label = "60 sec";
          else if (dim <= 120) dim_label = "2 min";
          else dim_label = "5 min";
          lv_label_set_text(id(lbl_dim_timeout_value), dim_label);

          // Update screen off timeout label
          int off = id(setting_screen_off_timeout);
          const char* off_label;
          if (off == 0) off_label = "Never";
          else if (off <= 60) off_label = "1 min";
          else if (off <= 180) off_label = "3 min";
          else if (off <= 300) off_label = "5 min";
          else off_label = "10 min";
          lv_label_set_text(id(lbl_screen_off_value), off_label);

          // Update debug mode button
          bool debug = id(setting_debug_mode_enabled);
          if (debug) {
            lv_label_set_text(id(lbl_debug_value), "ON");
            lv_obj_set_style_bg_color(id(btn_debug_toggle), lv_color_hex(0x00D1FF), 0);
            lv_obj_set_style_text_color(id(lbl_debug_value), lv_color_hex(0x121212), 0);
          } else {
            lv_label_set_text(id(lbl_debug_value), "OFF");
            lv_obj_set_style_bg_color(id(btn_debug_toggle), lv_color_hex(0x2A2A2A), 0);
            lv_obj_set_style_text_color(id(lbl_debug_value), lv_color_hex(0xFFFFFF), 0);
          }

          ESP_LOGI("settings", "Settings UI updated - Brightness: %d%%, Dim: %ds, Off: %ds, Debug: %s",
                   brightness_pct, dim, off, debug ? "ON" : "OFF");

# =============================================================================
# Layout Reference (320x240 screen)
# =============================================================================
#
# +--------------------------------------------------+
# | [<] Settings                                     |  y=0-44
# +--------------------------------------------------+
# | Brightness                              50%      |  y=50-58
# | [==================|------------]                |  y=68-88
# +--------------------------------------------------+
# | Dim After                        [  60 sec  ]   |  y=100-135
# +--------------------------------------------------+
# | Screen Off                       [   3 min  ]   |  y=140-175
# +--------------------------------------------------+
# | Debug Mode                       [    OFF   ]   |  y=180-215
# +--------------------------------------------------+
#
# =============================================================================

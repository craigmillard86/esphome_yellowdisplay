# =============================================================================
# UI Screen: Unified Browse List
# Purpose: Single reusable browse page for all categories (memory optimized)
# Categories: Recent(1), Favorites(2), Playlists(3), Albums(4), Artists(5)
# =============================================================================

lvgl:
  pages:
    - id: page_browse
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      width: 320
      height: 240
      scrollable: false
      widgets:
        # Header - Back button
        - button:
            id: btn_browse_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Header - Title (dynamic)
        - label:
            id: lbl_browse_title
            text: "Browse"
            text_font: roboto_16
            text_color: 0xFFFFFF
            align: TOP_MID
            y: 12

        # Header - Page indicator
        - label:
            id: lbl_browse_page_indicator
            text: ""
            text_font: roboto_12
            text_color: 0x808080
            align: TOP_RIGHT
            x: -8
            y: 14

        # Play All Button - visible in Artist Albums (category 6) and Album Songs (category 7)
        - button:
            id: btn_browse_play_all
            x: 244
            y: 6
            width: 68
            height: 32
            hidden: true
            bg_color: 0x00D1FF
            radius: 4
            border_width: 0
            shadow_width: 0
            pressed:
              bg_color: 0x00A8CC  # Darker cyan for touch feedback
            on_click:
              - logger.log:
                  tag: "browse"
                  level: INFO
                  format: "Play All button pressed for category %d"
                  args: ['id(current_browse_category)']
              - lambda: |-
                  int category = id(current_browse_category);
                  if (category == 6) {
                    // Artist Albums - play all by artist
                    id(play_artist_all).execute();
                  } else if (category == 7) {
                    // Album Songs - play all from album
                    id(play_album_all).execute();
                  }
            widgets:
              - label:
                  text: "Play All"
                  text_font: roboto_12
                  text_color: 0x000000
                  align: CENTER

        # Header divider
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0

        # Loading indicator
        - obj:
            id: browse_loading_indicator
            align: CENTER
            width: 200
            height: 60
            bg_opa: TRANSP
            border_width: 0
            hidden: true
            widgets:
              - spinner:
                  align: TOP_MID
                  width: 30
                  height: 30
                  spin_time: 1s
                  arc_length: 60deg
                  arc_color: 0x00D1FF
                  arc_width: 3
              - label:
                  text: "Loading..."
                  text_font: roboto_12
                  text_color: 0xB3B3B3
                  align: BOTTOM_MID
                  y: -5

        # Empty state
        - obj:
            id: browse_empty_state
            align: CENTER
            width: 200
            height: 60
            bg_opa: TRANSP
            border_width: 0
            hidden: true
            widgets:
              - label:
                  text: "\U000F0187"
                  text_font: icons_24
                  text_color: 0x4A4A4A
                  align: TOP_MID
              - label:
                  id: lbl_browse_empty_message
                  text: "No items found"
                  text_font: roboto_12
                  text_color: 0x808080
                  align: BOTTOM_MID
                  y: -5

        # List container (width adjusts: 286px normal, 262px with alpha picker)
        # Height: 152px fits 4 items (4 * 38px spacing)
        - obj:
            id: browse_list_container
            x: 8
            y: 44
            width: 286
            height: 152
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            scrollable: false
            pad_all: 0
            widgets:
              # List Item 0
              - button:
                  id: browse_item_0
                  x: 0
                  y: 0
                  width: 278
                  height: 36
                  pad_all: 0
                  bg_color: 0x1E1E1E
                  bg_opa: COVER
                  radius: 6
                  border_width: 1
                  border_color: 0x2A2A2A
                  shadow_width: 0
                  checkable: false
                  hidden: true
                  pressed:
                    border_color: 0x00D1FF
                    border_width: 2
                  on_click:
                    - if:
                        condition:
                          lambda: 'return id(current_browse_category) == 5;'
                        then:
                          # Artists -> Artist Albums drill-down
                          - script.execute:
                              id: browse_artist_albums
                              artist_id: !lambda 'return id(browse_item_0_media_id);'
                              artist_name: !lambda 'return id(browse_item_0_title);'
                        else:
                          - if:
                              condition:
                                lambda: 'return id(current_browse_category) == 4 || id(current_browse_category) == 6;'
                              then:
                                # Albums or Artist Albums -> Album Songs drill-down
                                - script.execute:
                                    id: browse_album_songs
                                    album_id: !lambda 'return id(browse_item_0_media_id);'
                                    album_name: !lambda 'return id(browse_item_0_title);'
                              else:
                                # Default: play the media item (playlists, songs, etc.)
                                - script.execute:
                                    id: play_media_item
                                    media_id: !lambda 'return id(browse_item_0_media_id);'
                                    item_title: !lambda 'return id(browse_item_0_title);'

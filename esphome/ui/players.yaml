# =============================================================================
# UI Screen: Player Management (T055)
# Purpose: Screen for selecting and managing media players
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts, icons)
#               packages/player_manager.yaml (player state management)
#               packages/navigation.yaml (screen navigation)
# Exposes: page_players LVGL page with player list
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This file implements:
# - T055: Create Player Management screen layout
# - T063: Implement tap-to-select behavior for player rows
# - T103: Add Group button to Player Management header

# =============================================================================
# Display Order Mapping (for tree view sorting)
# =============================================================================
# Maps UI row index to actual player data index
# Updated by update_player_rows script when sorting by groups

globals:
  - id: display_order_row_0
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_order_row_1
    type: int
    restore_value: no
    initial_value: '1'
  - id: display_order_row_2
    type: int
    restore_value: no
    initial_value: '2'
  - id: display_order_row_3
    type: int
    restore_value: no
    initial_value: '3'

# Screen Layout:
# +--------------------------------------------------+
# | [<] Players 0/0                [Unjoin] [Group]  |  <- Header (44px)
# +--------------------------------------------------+
# | +----------------------------------------------+ |
# | | [*] Player 1 Name              [===] [pwr]   | |  <- Player rows
# | +----------------------------------------------+ |  <- 56px each
# | | [ ] Player 2 Name              [===] [pwr]   | |
# | +----------------------------------------------+ |
# | | ...                                          | |
# | +----------------------------------------------+ |
# +--------------------------------------------------+

lvgl:
  pages:
    # =========================================================================
    # Players Screen (T055)
    # =========================================================================
    - id: page_players
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      widgets:
        # =====================================================================
        # HEADER AREA (44px height)
        # =====================================================================

        # Back Button - Top Left (44x44px touch target)
        - button:
            id: btn_players_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Players screen back button pressed"
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"  # mdi:arrow-left
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Screen Title - Left aligned after back button
        - label:
            id: lbl_players_title
            text: "Players"
            text_font: roboto_16
            text_color: 0xFFFFFF
            x: 48
            y: 12

        # Player Count Badge - Next to title
        - label:
            id: lbl_players_count
            text: "0/0"
            text_font: roboto_12
            text_color: 0xB3B3B3
            x: 110
            y: 14

        # Unjoin Button - Top Right (left of Group button)
        # Removes selected player from its group
        # Only visible when selected player is in a group
        - button:
            id: btn_players_unjoin
            align: TOP_RIGHT
            x: -44
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            hidden: true  # Hidden by default, shown when player is in group
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Unjoin button pressed"
              - script.execute: unjoin_selected_player
            widgets:
              - label:
                  id: lbl_unjoin_icon
                  text: "\U000F04C3"  # mdi:speaker-off (unjoin/solo)
                  text_font: icons_24
                  text_color: 0xFF6B35  # Orange for destructive action
                  align: CENTER

        # Group Button - Top Right (T103)
        # Opens the grouping screen for multi-room speaker groups
        - button:
            id: btn_players_group
            align: TOP_RIGHT
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Group button pressed - navigating to grouping screen"
              - script.execute:
                  id: navigate_to
                  target_screen: 11
            widgets:
              - label:
                  text: "\U000F0D38"  # mdi:speaker-multiple (group)
                  text_font: icons_24
                  text_color: 0x00D1FF
                  align: CENTER

        # Header Divider Line
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0

        # =====================================================================
        # SCROLLABLE PLAYER LIST CONTAINER
        # =====================================================================
        # Flex container with vertical scroll for player rows
        # Position: Below header, fills remaining screen
        # Size: 320x196 (240 - 44 header)

        - obj:
            id: player_list_container
            x: 0
            y: 44
            width: 320
            height: 196
            bg_color: 0x121212
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            pad_all: 4
            scrollbar_mode: AUTO
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              # =================================================================
              # PLAYER ROW 0
              # =================================================================
              - button:
                  id: player_row_0
                  width: 304
                  height: 56
                  bg_color: 0x1E1E1E
                  radius: 8
                  border_width: 1
                  border_color: 0x2A2A2A
                  shadow_width: 0
                  pad_all: 8
                  hidden: true  # Hidden until player registered
                  pressed:
                    bg_color: 0x2A2A2A
                  on_click:
                    - logger.log:
                        tag: "ui"
                        level: INFO
                        format: "Player row 0 selected (mapped)"
                    - script.execute:
                        id: select_player
                        player_index: !lambda 'return id(display_order_row_0);'
                  widgets:
                    # Selection indicator (checkmark when selected)
                    - label:
                        id: player_0_check
                        text: "\U000F012C"  # mdi:check-circle (filled)
                        text_font: icons_24
                        text_color: 0x00D1FF
                        x: 4
                        y: 8
                        hidden: true
                    # Selection indicator (empty circle when not selected)
                    - label:
                        id: player_0_circle
                        text: "\U000F0765"  # mdi:circle-outline
                        text_font: icons_24
                        text_color: 0x666666
                        x: 4
                        y: 8
                    # Crown icon for group leader (hidden by default)
                    - label:
                        id: player_0_crown
                        text: "\U000F01A5"  # mdi:crown
                        text_font: icons_24
                        text_color: 0xFFD700  # Gold
                        x: 36
                        y: 8
                        hidden: true
                    # Link icon for group member (hidden by default)
                    - label:
                        id: player_0_link
                        text: "\U000F0337"  # mdi:link
                        text_font: icons_24
                        text_color: 0x4CAF50  # Green
                        x: 36
                        y: 8
                        hidden: true
                    # Player name
                    - label:
                        id: player_0_name_lbl
                        text: "Player 0"
                        text_font: roboto_16
                        text_color: 0xFFFFFF
                        x: 36
                        y: 4
                        width: 140
                        long_mode: SCROLL_CIRCULAR
                    # Online/Offline status
                    - label:
                        id: player_0_status
                        text: "Online"
                        text_font: roboto_12
                        text_color: 0x00D1FF
                        x: 36

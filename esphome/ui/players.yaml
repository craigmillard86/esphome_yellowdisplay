# =============================================================================
# Scripts - Player Row UI Updates
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  # Update Player Row UI (T062)
  # ---------------------------------------------------------------------------
  # Updates player row display based on player data with TREE VIEW sorting
  # Groups are displayed together: leader first, then members indented below
  # Called when navigating to players screen or when player state changes
  - id: update_player_rows
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("players_ui", "Updating player row UI with tree view...");

          int visible_count = 0;
          int selected_group_status = 0;  // Track selected player's group status

          // Player data arrays
          std::string entities[4] = {
            id(player_0_entity_id), id(player_1_entity_id),
            id(player_2_entity_id), id(player_3_entity_id)
          };
          std::string names[4] = {
            id(player_0_name), id(player_1_name),
            id(player_2_name), id(player_3_name)
          };
          bool online[4] = {
            id(player_0_online), id(player_1_online),
            id(player_2_online), id(player_3_online)
          };
          int volumes[4] = {
            id(player_0_volume), id(player_1_volume),
            id(player_2_volume), id(player_3_volume)
          };
          int group_statuses[4] = {
            id(player_0_group_status), id(player_1_group_status),
            id(player_2_group_status), id(player_3_group_status)
          };
          int group_sizes[4] = {
            id(player_0_group_size), id(player_1_group_size),
            id(player_2_group_size), id(player_3_group_size)
          };
          std::string group_leaders[4] = {
            id(player_0_group_leader), id(player_1_group_leader),
            id(player_2_group_leader), id(player_3_group_leader)
          };

          // UI widget arrays
          lv_obj_t* rows[4] = {
            id(player_row_0), id(player_row_1), id(player_row_2), id(player_row_3)
          };
          lv_obj_t* checks[4] = {
            id(player_0_check), id(player_1_check), id(player_2_check), id(player_3_check)
          };
          lv_obj_t* circles[4] = {
            id(player_0_circle), id(player_1_circle), id(player_2_circle), id(player_3_circle)
          };
          lv_obj_t* crowns[4] = {
            id(player_0_crown), id(player_1_crown), id(player_2_crown), id(player_3_crown)
          };
          lv_obj_t* links[4] = {
            id(player_0_link), id(player_1_link), id(player_2_link), id(player_3_link)
          };
          lv_obj_t* name_lbls[4] = {
            id(player_0_name_lbl), id(player_1_name_lbl), id(player_2_name_lbl), id(player_3_name_lbl)
          };
          lv_obj_t* status_lbls[4] = {
            id(player_0_status), id(player_1_status), id(player_2_status), id(player_3_status)
          };
          lv_obj_t* vol_sliders[4] = {
            id(player_0_volume_slider), id(player_1_volume_slider),
            id(player_2_volume_slider), id(player_3_volume_slider)
          };

          // Build sorted display order: leaders first, then their members, then ungrouped
          int display_order[4];
          bool used[4] = {false, false, false, false};
          int display_idx = 0;

          // Pass 1: Add leaders and their members
          for (int i = 0; i < 4; i++) {
            if (!entities[i].empty() && !used[i] && group_statuses[i] == 1) {
              // This is a leader - add it
              display_order[display_idx++] = i;
              used[i] = true;

              // Find and add all members of this leader
              for (int j = 0; j < 4; j++) {
                if (!entities[j].empty() && !used[j] && group_statuses[j] == 2) {
                  // Check if this member belongs to leader i
                  if (group_leaders[j] == entities[i]) {
                    display_order[display_idx++] = j;
                    used[j] = true;
                  }
                }
              }
            }
          }

          // Pass 2: Add ungrouped players
          for (int i = 0; i < 4; i++) {
            if (!entities[i].empty() && !used[i]) {
              display_order[display_idx++] = i;
              used[i] = true;
            }
          }

          // Fill remaining with -1 (empty)
          while (display_idx < 4) {
            display_order[display_idx++] = -1;
          }

          ESP_LOGD("players_ui", "Display order: %d, %d, %d, %d",
                   display_order[0], display_order[1], display_order[2], display_order[3]);

          // Save display order to globals for click handlers
          id(display_order_row_0) = display_order[0];
          id(display_order_row_1) = display_order[1];
          id(display_order_row_2) = display_order[2];
          id(display_order_row_3) = display_order[3];

          // Render rows in sorted order
          for (int row_idx = 0; row_idx < 4; row_idx++) {
            int player_idx = display_order[row_idx];

            lv_obj_t* row = rows[row_idx];
            lv_obj_t* check = checks[row_idx];
            lv_obj_t* circle = circles[row_idx];
            lv_obj_t* crown = crowns[row_idx];
            lv_obj_t* link = links[row_idx];
            lv_obj_t* name_lbl = name_lbls[row_idx];
            lv_obj_t* status_lbl = status_lbls[row_idx];
            lv_obj_t* vol_slider = vol_sliders[row_idx];

            // Null check
            if (row == nullptr) continue;

            // Hide row if no player data
            if (player_idx < 0 || entities[player_idx].empty()) {
              lv_obj_add_flag(row, LV_OBJ_FLAG_HIDDEN);
              continue;
            }

            // Get player data
            const std::string& entity_id = entities[player_idx];
            const std::string& name = names[player_idx];
            bool is_online = online[player_idx];
            int volume = volumes[player_idx];
            int group_status = group_statuses[player_idx];
            int group_size = group_sizes[player_idx];

            visible_count++;
            lv_obj_clear_flag(row, LV_OBJ_FLAG_HIDDEN);

            // Reset border to default
            lv_obj_set_style_border_color(row, lv_color_hex(0x2A2A2A), 0);
            lv_obj_set_style_border_width(row, 1, 0);

            // Update name
            lv_label_set_text(name_lbl, name.c_str());

            // Check if this is selected player
            bool is_selected = (entity_id == id(selected_player_id));

            if (is_selected) {
              lv_obj_clear_flag(check, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(circle, LV_OBJ_FLAG_HIDDEN);
              selected_group_status = group_status;
            } else {
              lv_obj_add_flag(check, LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(circle, LV_OBJ_FLAG_HIDDEN);
            }

            // Update crown/link icons and indentation based on group status
            if (group_status == 1) {
              // Leader - show crown, gold border
              lv_obj_clear_flag(crown, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(link, LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_border_color(row, lv_color_hex(0xFFD700), 0);
              lv_obj_set_style_border_width(row, 2, 0);
              lv_obj_set_style_x(name_lbl, 64, 0);
              lv_obj_set_style_x(status_lbl, 64, 0);
            } else if (group_status == 2) {
              // Member - show link icon, indent more
              lv_obj_add_flag(crown, LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(link, LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_x(name_lbl, 64, 0);
              lv_obj_set_style_x(status_lbl, 64, 0);
            } else {
              // Not in group - normal position
              lv_obj_add_flag(crown, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(link, LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_x(name_lbl, 36, 0);
              lv_obj_set_style_x(status_lbl, 36, 0);
            }

            // Update status text
            if (is_online) {
              if (group_status == 1) {
                char buf[16];
                snprintf(buf, sizeof(buf), "Leader (%d)", group_size);
                lv_label_set_text(status_lbl, buf);
                lv_obj_set_style_text_color(status_lbl, lv_color_hex(0xFFD700), 0);
              } else if (group_status == 2) {
                lv_label_set_text(status_lbl, "Grouped");
                lv_obj_set_style_text_color(status_lbl, lv_color_hex(0x4CAF50), 0);
              } else {
                lv_label_set_text(status_lbl, "Online");
                lv_obj_set_style_text_color(status_lbl, lv_color_hex(0x00D1FF), 0);
              }
              lv_obj_set_style_text_color(name_lbl, lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_text_color(circle, lv_color_hex(0x666666), 0);
            } else {
              lv_label_set_text(status_lbl, "Offline");
              lv_obj_set_style_text_color(status_lbl, lv_color_hex(0x666666), 0);
              lv_obj_set_style_text_color(name_lbl, lv_color_hex(0x666666), 0);
              lv_obj_set_style_text_color(circle, lv_color_hex(0x444444), 0);
            }

            // Update volume slider
            lv_slider_set_value(vol_slider, volume, LV_ANIM_OFF);
          }

          // Show/hide unjoin button based on selected player's group status
          lv_obj_t* unjoin_btn = id(btn_players_unjoin);
          if (unjoin_btn != nullptr) {
            if (selected_group_status > 0) {
              lv_obj_clear_flag(unjoin_btn, LV_OBJ_FLAG_HIDDEN);
              ESP_LOGD("players_ui", "Unjoin button shown (group_status=%d)", selected_group_status);
            } else {
              lv_obj_add_flag(unjoin_btn, LV_OBJ_FLAG_HIDDEN);
            }
          }

          // Show/hide "No players" message (with null check)
          lv_obj_t* no_players_lbl = id(lbl_no_players);
          if (no_players_lbl != nullptr) {
            if (visible_count == 0) {
              lv_obj_clear_flag(no_players_lbl, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(no_players_lbl, LV_OBJ_FLAG_HIDDEN);
            }
          }

          // Update count label (with null check)
          lv_obj_t* count_lbl = id(lbl_players_count);
          if (count_lbl != nullptr) {
            char count_str[16];
            snprintf(count_str, sizeof(count_str), "%d/%d",
                     id(online_player_count), id(available_player_count));
            lv_label_set_text(count_lbl, count_str);
          }

          ESP_LOGI("players_ui", "Updated %d visible player rows", visible_count);

# =============================================================================
# Usage Notes
# =============================================================================
#
# This screen displays available media players in a scrollable list.
# Each row shows:
#   - Selection indicator (checkmark if selected, circle if not)
#   - Crown icon for group leaders (gold)
#   - Link icon for group members (indented appearance)
#   - Player name (with scroll for long names)
#   - Status (Online/Offline/Leader/Grouped)
#   - Volume slider (110px width)
#
# Layout Notes:
#   - Row width is 304px to account for scrollbar (320 - 8 padding - 8 scrollbar)
#   - Scrollbar appears automatically when content overflows (scrollbar_mode: AUTO)
#   - Each row is 56px height with 8px padding
#
# Offline players are shown in grey (#666666) per FR-034.
# Tapping an offline player shows brief orange border feedback.
#
# When a player is selected:
#   - It becomes the active media player for all controls
#   - Selection is persisted to NVS for boot restore
#   - The checkmark indicator appears
#
# To update the UI when player states change:
#   - script.execute: update_player_rows
#
# Navigation:
#   - Back button returns to previous screen (navigate_back)
#   - Home screen Speakers tile navigates here (navigate_to target_screen: 2)
#
# =============================================================================

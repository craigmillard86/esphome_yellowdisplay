# =============================================================================
# UI Screen: Player Management (T055)
# Purpose: Screen for selecting and managing media players
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts, icons)
#               packages/player_manager.yaml (player state management)
#               packages/navigation.yaml (screen navigation)
# Exposes: page_players LVGL page with player list
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This file implements:
# - T055: Create Player Management screen layout
# - T063: Implement tap-to-select behavior for player rows

# Screen Layout:
# +--------------------------------------------------+
# | [<] Select Player                          [0/0] |  <- Header (44px)
# +--------------------------------------------------+
# | +----------------------------------------------+ |
# | | [*] Player 1 Name              [===] [pwr]   | |  <- Player rows
# | +----------------------------------------------+ |  <- 56px each
# | | [ ] Player 2 Name              [===] [pwr]   | |
# | +----------------------------------------------+ |
# | | ...                                          | |
# | +----------------------------------------------+ |
# +--------------------------------------------------+

lvgl:
  pages:
    # =========================================================================
    # Players Screen (T055)
    # =========================================================================
    - id: page_players
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      widgets:
        # =====================================================================
        # HEADER AREA (44px height)
        # =====================================================================

        # Back Button - Top Left (44x44px touch target)
        - button:
            id: btn_players_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Players screen back button pressed"
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"  # mdi:arrow-left
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Screen Title
        - label:
            id: lbl_players_title
            text: "Select Player"
            text_font: roboto_16
            text_color: 0xFFFFFF
            align: TOP_MID
            x: 0
            y: 12
            text_align: CENTER

        # Player Count Badge - Top Right
        - label:
            id: lbl_players_count
            text: "0/0"
            text_font: roboto_12
            text_color: 0xB3B3B3
            align: TOP_RIGHT
            x: -8
            y: 14

        # Header Divider Line
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0

        # =====================================================================
        # SCROLLABLE PLAYER LIST CONTAINER
        # =====================================================================
        # Flex container with vertical scroll for player rows
        # Position: Below header, fills remaining screen
        # Size: 320x196 (240 - 44 header)

        - obj:
            id: player_list_container
            x: 0
            y: 44
            width: 320
            height: 196
            bg_color: 0x121212
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            pad_all: 4
            scrollbar_mode: AUTO
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              # =================================================================
              # PLAYER ROW 0
              # =================================================================
              - button:
                  id: player_row_0
                  width: 304
                  height: 56
                  bg_color: 0x1E1E1E
                  radius: 8
                  border_width: 1
                  border_color: 0x2A2A2A
                  shadow_width: 0
                  pad_all: 8
                  hidden: true  # Hidden until player registered
                  pressed:
                    bg_color: 0x2A2A2A
                  on_click:
                    - logger.log:
                        tag: "ui"
                        level: INFO
                        format: "Player row 0 selected"
                    - script.execute:
                        id: select_player
                        player_index: 0
                  widgets:
                    # Selection indicator (checkmark when selected)
                    - label:
                        id: player_0_check
                        text: "\U000F012C"  # mdi:check-circle (filled)
                        text_font: icons_24
                        text_color: 0x00D1FF
                        x: 4
                        y: 8
                        hidden: true
                    # Selection indicator (empty circle when not selected)
                    - label:
                        id: player_0_circle
                        text: "\U000F0765"  # mdi:circle-outline
                        text_font: icons_24
                        text_color: 0x666666
                        x: 4
                        y: 8
                    # Player name
                    - label:
                        id: player_0_name_lbl
                        text: "Player 0"
                        text_font: roboto_16
                        text_color: 0xFFFFFF
                        x: 36
                        y: 4
                        width: 120
                        long_mode: SCROLL_CIRCULAR
                    # Online/Offline status
                    - label:
                        id: player_0_status
                        text: "Online"
                        text_font: roboto_12
                        text_color: 0x00D1FF
                        x: 36
                        y: 24
                    # Volume slider (50% width = 156px, but we use smaller)
                    - slider:
                        id: player_0_volume_slider
                        x: 160
                        y: 16
                        width: 80
                        height: 20
                        min_value: 0
                        max_value: 100
                        value: 50
                        bg_color: 0x2A2A2A
                        radius: 4
                        indicator:
                          bg_color: 0x00D1FF
                          radius: 4
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 12
                          height: 12
                        on_release:
                          - script.execute:
                              id: set_player_volume
                              player_index: 0
                              volume_percent: !lambda 'return (int)x;'
                    # Power button
                    - button:
                        id: player_0_power
                        x: 252
                        y: 4

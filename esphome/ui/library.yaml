# =============================================================================
# UI Screen: Music Library Hub (T070)
# Purpose: Central hub for browsing music library categories
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts, icons)
#               packages/navigation.yaml (screen navigation)
#               packages/browse.yaml (browse scripts)
# Exposes: page_library LVGL page with category tiles
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This file implements:
# - T070: Create Music Library Hub screen with category tiles
#
# Screen Layout (Screen F per ui-technical-spec.md):
# +--------------------------------------------------+
# | [<] Music Library                                |  <- Header (44px)
# +--------------------------------------------------+
# | +----------+  +----------+  +----------+         |
# | | Recent   |  | Favs     |  | Search   |         |  <- 2x3 Grid
# | +----------+  +----------+  +----------+         |  <- Each 100x80px
# | +----------+  +----------+  +----------+         |
# | | Playlists|  | Albums   |  | Artists  |         |
# | +----------+  +----------+  +----------+         |
# +--------------------------------------------------+
#
# Navigation:
# - Recently Played → page_browse_recent (screen 7)
# - Favorites → page_browse_favorites (screen 4)
# - Playlists → page_browse_playlists (screen 8)
# - Albums → page_browse_albums (screen 9)
# - Artists → page_browse_artists (screen 10)
# - Search → page_search (screen 5)

lvgl:
  pages:
    # =========================================================================
    # Music Library Hub Screen (T070)
    # =========================================================================
    - id: page_library
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      widgets:
        # =====================================================================
        # HEADER AREA (44px height)
        # =====================================================================

        # Back Button - Top Left (44x44px touch target)
        - button:
            id: btn_library_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Library screen back button pressed"
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"  # mdi:arrow-left
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Screen Title
        - label:
            id: lbl_library_title
            text: "Music Library"
            text_font: roboto_16
            text_color: 0xFFFFFF
            align: TOP_MID
            x: 0
            y: 12
            text_align: CENTER

        # Header Divider Line
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0

        # =====================================================================
        # CATEGORY TILES - 2x3 Grid Layout
        # =====================================================================
        # Grid: 2 rows, 3 columns
        # Tile size: 100x80px each
        # Gaps: 4px horizontal, 4px vertical
        # Margins: 10px outer
        # Total width: (100*3) + (4*2) + (10*2) = 328px (needs adjustment)
        # Adjusted: 98x76px tiles with 4px gaps = (98*3) + (4*2) + (10*2) = 322px ✓

        # =====================================================================
        # ROW 1 - TOP THREE TILES
        # =====================================================================

        # TOP LEFT TILE - Recently Played
        - button:
            id: tile_recent
            x: 10
            y: 52
            width: 98
            height: 76
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 10
            border_width: 1
            border_color: 0x2A2A2A
            shadow_width: 0
            checkable: false
            pressed:
              border_color: 0x00D1FF
              border_width: 2
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Recently Played tile pressed"
              - script.execute:
                  id: navigate_to
                  target_screen: 7  # BROWSE_RECENT
            widgets:
              # Icon
              - label:
                  text: "\U000F075A"  # mdi:music
                  text_font: icons_24
                  text_color: 0x00D1FF
                  align: TOP_MID
                  x: 0
                  y: 12
              # Label
              - label:
                  text: "Recent"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: BOTTOM_MID
                  x: 0
                  y: -8

        # TOP CENTER TILE - Favorites
        - button:
            id: tile_library_favorites
            x: 112
            y: 52
            width: 98
            height: 76
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 10
            border_width: 1
            border_color: 0x2A2A2A
            shadow_width: 0
            checkable: false
            pressed:
              border_color: 0x00D1FF
              border_width: 2
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Favorites tile pressed"
              - script.execute:
                  id: navigate_to
                  target_screen: 4  # FAVORITES (same as home tile)
            widgets:
              # Icon
              - label:
                  text: "\U000F02D1"  # mdi:heart
                  text_font: icons_24
                  text_color: 0xFF6B35
                  align: TOP_MID
                  x: 0
                  y: 12
              # Label
              - label:
                  text: "Favorites"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: BOTTOM_MID
                  x: 0
                  y: -8

        # TOP RIGHT TILE - Search
        - button:
            id: tile_library_search
            x: 214
            y: 52
            width: 98
            height: 76
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 10
            border_width: 1
            border_color: 0x2A2A2A
            shadow_width: 0
            checkable: false
            pressed:
              border_color: 0x00D1FF
              border_width: 2
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Search tile pressed"
              - script.execute:
                  id: navigate_to
                  target_screen: 5  # SEARCH
            widgets:
              # Icon
              - label:
                  text: "\U000F0349"  # mdi:magnify
                  text_font: icons_24
                  text_color: 0x00D1FF
                  align: TOP_MID
                  x: 0
                  y: 12
              # Label
              - label:
                  text: "Search"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: BOTTOM_MID
                  x: 0
                  y: -8

        # =====================================================================
        # ROW 2 - BOTTOM THREE TILES
        # =====================================================================

        # BOTTOM LEFT TILE - Playlists
        - button:
            id: tile_playlists
            x: 10
            y: 136
            width: 98
            height: 76
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 10
            border_width: 1
            border_color: 0x2A2A2A
            shadow_width: 0
            checkable: false
            pressed:
              border_color: 0x00D1FF
              border_width: 2
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Playlists tile pressed"
              - script.execute:
                  id: navigate_to
                  target_screen: 8  # BROWSE_PLAYLISTS
            widgets:
              # Icon
              - label:
                  text: "\U000F0486"  # mdi:playlist-music
                  text_font: icons_24
                  text_color: 0x00D1FF
                  align: TOP_MID
                  x: 0
                  y: 12
              # Label
              - label:
                  text: "Playlists"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: BOTTOM_MID
                  x: 0
                  y: -8

        # BOTTOM CENTER TILE - Albums
        - button:
            id: tile_albums
            x: 112
            y: 136
            width: 98
            height: 76
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 10
            border_width: 1
            border_color: 0x2A2A2A
            shadow_width: 0
            checkable: false
            pressed:
              border_color: 0x00D1FF
              border_width: 2
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Albums tile pressed"
              - script.execute:
                  id: navigate_to
                  target_screen: 9  # BROWSE_ALBUMS
            widgets:
              # Icon
              - label:
                  text: "\U000F0025"  # mdi:album
                  text_font: icons_24
                  text_color: 0x00D1FF
                  align: TOP_MID
                  x: 0
                  y: 12
              # Label
              - label:
                  text: "Albums"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: BOTTOM_MID
                  x: 0
                  y: -8

        # BOTTOM RIGHT TILE - Artists
        - button:
            id: tile_artists
            x: 214
            y: 136
            width: 98
            height: 76
            bg_color: 0x1E1E1E
            bg_opa: COVER
            radius: 10
            border_width: 1
            border_color: 0x2A2A2A
            shadow_width: 0
            checkable: false
            pressed:
              border_color: 0x00D1FF
              border_width: 2
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Artists tile pressed"
              - script.execute:
                  id: navigate_to
                  target_screen: 10  # BROWSE_ARTISTS
            widgets:
              # Icon
              - label:
                  text: "\U000F0006"  # mdi:account-music
                  text_font: icons_24
                  text_color: 0x00D1FF
                  align: TOP_MID
                  x: 0
                  y: 12
              # Label
              - label:
                  text: "Artists"
                  text_font: roboto_12
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: BOTTOM_MID
                  x: 0
                  y: -8

# =============================================================================
# Icon Reference (Material Design Icons)
# =============================================================================
# These icons must be added to the icons_24 font in lvgl.yaml if not present:
#
# - "\U000F075A"  # mdi:music (Recently Played)
# - "\U000F02D1"  # mdi:heart (Favorites)
# - "\U000F0349"  # mdi:magnify (Search)
# - "\U000F0486"  # mdi:playlist-music (Playlists)
# - "\U000F0025"  # mdi:album (Albums)
# - "\U000F0006"  # mdi:account-music (Artists)
#
# =============================================================================
# Navigation Screen IDs
# =============================================================================
# These screens must be defined in navigation.yaml and lvgl.yaml:
#
# - 3 = LIBRARY (this screen - page_library)
# - 4 = FAVORITES (page_browse_favorites)
# - 5 = SEARCH (page_search)
# - 7 = BROWSE_RECENT (page_browse_recent)
# - 8 = BROWSE_PLAYLISTS (page_browse_playlists)
# - 9 = BROWSE_ALBUMS (page_browse_albums)
# - 10 = BROWSE_ARTISTS (page_browse_artists)
#
# =============================================================================

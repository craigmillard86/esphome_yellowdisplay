# =============================================================================
# Scripts - UI Update Logic
# =============================================================================

script:
  - id: update_artists_list
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("browse_ui", "Updating Artists list UI");

          int loaded_count = id(browse_loaded_items);
          int offset = id(browse_page_offset);
          int total = id(browse_total_items);

          // Hide loading indicator
          lv_obj_add_flag(id(loading_indicator_artists), LV_OBJ_FLAG_HIDDEN);

          // Show empty state if no items loaded
          if (loaded_count == 0) {
            lv_obj_clear_flag(id(empty_state_artists), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(artists_pagination_footer), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(lbl_artists_page_indicator), "");
            return;
          }

          // Hide empty state
          lv_obj_add_flag(id(empty_state_artists), LV_OBJ_FLAG_HIDDEN);

          // Update page indicator
          char page_text[32];
          if (total > 0) {
            snprintf(page_text, sizeof(page_text), "%d-%d of %d", offset + 1, offset + loaded_count, total);
          } else {
            snprintf(page_text, sizeof(page_text), "%d-%d", offset + 1, offset + loaded_count);
          }
          lv_label_set_text(id(lbl_artists_page_indicator), page_text);

          // Show/hide pagination buttons based on position
          if (loaded_count > 0 && (offset > 0 || (total > 0 && offset + loaded_count < total))) {
            lv_obj_clear_flag(id(artists_pagination_footer), LV_OBJ_FLAG_HIDDEN);

            if (offset > 0) {
              lv_obj_clear_flag(id(btn_artists_prev), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(btn_artists_prev), LV_OBJ_FLAG_HIDDEN);
            }

            if (total > 0 && offset + loaded_count < total) {
              lv_obj_clear_flag(id(btn_artists_next), LV_OBJ_FLAG_HIDDEN);
            } else if (total == 0 && loaded_count == 10) {
              lv_obj_clear_flag(id(btn_artists_next), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(btn_artists_next), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(artists_pagination_footer), LV_OBJ_FLAG_HIDDEN);
          }

          // Update items 0-9
          if (loaded_count > 0) {
            lv_label_set_text(id(lbl_artists_item_0_title), id(browse_item_0_title).c_str());
            lv_label_set_text(id(lbl_artists_item_0_subtitle), id(browse_item_0_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_0), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_0), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 1) {
            lv_label_set_text(id(lbl_artists_item_1_title), id(browse_item_1_title).c_str());
            lv_label_set_text(id(lbl_artists_item_1_subtitle), id(browse_item_1_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_1), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_1), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 2) {
            lv_label_set_text(id(lbl_artists_item_2_title), id(browse_item_2_title).c_str());
            lv_label_set_text(id(lbl_artists_item_2_subtitle), id(browse_item_2_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_2), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_2), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 3) {
            lv_label_set_text(id(lbl_artists_item_3_title), id(browse_item_3_title).c_str());
            lv_label_set_text(id(lbl_artists_item_3_subtitle), id(browse_item_3_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_3), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_3), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 4) {
            lv_label_set_text(id(lbl_artists_item_4_title), id(browse_item_4_title).c_str());
            lv_label_set_text(id(lbl_artists_item_4_subtitle), id(browse_item_4_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_4), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_4), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 5) {
            lv_label_set_text(id(lbl_artists_item_5_title), id(browse_item_5_title).c_str());
            lv_label_set_text(id(lbl_artists_item_5_subtitle), id(browse_item_5_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_5), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_5), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 6) {
            lv_label_set_text(id(lbl_artists_item_6_title), id(browse_item_6_title).c_str());
            lv_label_set_text(id(lbl_artists_item_6_subtitle), id(browse_item_6_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_6), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_6), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 7) {
            lv_label_set_text(id(lbl_artists_item_7_title), id(browse_item_7_title).c_str());
            lv_label_set_text(id(lbl_artists_item_7_subtitle), id(browse_item_7_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_7), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_7), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 8) {
            lv_label_set_text(id(lbl_artists_item_8_title), id(browse_item_8_title).c_str());
            lv_label_set_text(id(lbl_artists_item_8_subtitle), id(browse_item_8_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_8), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_8), LV_OBJ_FLAG_HIDDEN);
          }

          if (loaded_count > 9) {
            lv_label_set_text(id(lbl_artists_item_9_title), id(browse_item_9_title).c_str());
            lv_label_set_text(id(lbl_artists_item_9_subtitle), id(browse_item_9_subtitle).c_str());
            lv_obj_clear_flag(id(artists_item_9), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artists_item_9), LV_OBJ_FLAG_HIDDEN);
          }

          // Scroll list to top
          lv_obj_scroll_to_y(id(artists_list_container), 0, LV_ANIM_OFF);

          ESP_LOGI("browse_ui", "Artists list UI updated: %d items visible", loaded_count);

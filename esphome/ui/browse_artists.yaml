                  checkable: false
                  hidden: true
                  pressed:
                    border_color: 0x00D1FF
                    border_width: 2
                  on_click:
                    - script.execute:
                        id: play_media_item
                        media_id: !lambda 'return id(browse_item_0_media_id);'
                        item_title: !lambda 'return id(browse_item_0_title);'
                  widgets:

# =============================================================================
# UI Screen: Artists Browse List (T078, T080, T081, T088)
# Purpose: Display artists from Music Assistant library with pagination and A-Z nav
# Category: 5 (ARTISTS)
# =============================================================================

lvgl:
  pages:
    - id: page_browse_artists
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      on_load:
        - logger.log:
            tag: "browse"
            level: INFO
            format: "Artists screen loaded"
        # Show loading indicator, hide empty state
        - lambda: |-
            lv_obj_clear_flag(id(loading_indicator_artists), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(empty_state_artists), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(artists_pagination_footer), LV_OBJ_FLAG_HIDDEN);
        # Load content
        - script.execute:
            id: browse_category
            category: 5  # ARTISTS
      widgets:
        # Header - Back button
        - button:
            id: btn_artists_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Header - Title
        - label:
            text: "Artists"
            text_font: roboto_16
            text_color: 0xFFFFFF
            align: TOP_MID
            y: 12

        # Header - Page indicator
        - label:
            id: lbl_artists_page_indicator
            text: ""
            text_font: roboto_12
            text_color: 0x808080
            align: TOP_RIGHT
            x: -8
            y: 14

        # Header divider
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0


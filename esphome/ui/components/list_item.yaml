# =============================================================================
# UI Component: List Item (T071)
# Purpose: Text-only list item component for browse screens
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts)
# Usage: Included in browse screens for content lists
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This component implements:
# - T071: Create list item component (text only)
#
# Component Design:
# - Rectangular button with full-width layout
# - Text-only display (no thumbnails per spec)
# - Primary text (title) in white
# - Secondary text (subtitle/metadata) in gray
# - Press state with cyan border highlight
# - Minimum 44px height for touch target compliance
#
# Usage Example:
# - button:
#     id: list_item_1
#     width: 304  # Full width minus 16px margin
#     height: 56
#     styles: style_list_item_normal
#     pressed:
#       styles: style_list_item_pressed
#     on_click:
#       - script.execute: play_media_item
#     widgets:
#       - label:
#           text: "Item Title"
#           text_font: roboto_16
#           text_color: 0xFFFFFF
#           align: TOP_LEFT
#           x: 12
#           y: 8
#       - label:
#           text: "Subtitle or metadata"
#           text_font: roboto_12
#           text_color: 0xB3B3B3
#           align: TOP_LEFT
#           x: 12
#           y: 28

# =============================================================================
# Style Definitions
# =============================================================================
# Note: These styles are defined in lvgl.yaml style_definitions section
# This file documents the component pattern for reference

# List Item - Normal State
# - id: style_list_item_normal
#   bg_color: 0x1E1E1E
#   bg_opa: COVER
#   radius: 8
#   border_width: 1
#   border_color: 0x2A2A2A
#   border_opa: COVER
#   pad_all: 0
#   shadow_width: 0

# List Item - Pressed State
# - id: style_list_item_pressed

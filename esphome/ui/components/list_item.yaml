#   shadow_width: 0

# =============================================================================
# Implementation Notes
# =============================================================================
#
# Layout Guidelines:
# - Full width: 304px (320px - 16px margins)
# - Height: 56px minimum (44px touch target + 12px padding)
# - Internal padding: 12px horizontal, 8px vertical
# - Gap between items: 4px
#
# Text Layout:
# - Primary text: Top-left aligned, 12px from left, 8px from top
# - Secondary text: Top-left aligned, 12px from left, 28px from top
# - Long text: Use SCROLL_CIRCULAR mode for overflow
#
# Touch Feedback:
# - Border changes from 1px gray to 2px cyan on press
# - No shadow (shadow_width: 0 to remove LVGL default)
# - Background color remains constant for consistency
#
# Accessibility:
# - Minimum 44px touch target height
# - High contrast text (white on dark gray)
# - Clear visual feedback on interaction
#
# Memory Optimization:
# - Text-only design (no images) to minimize RAM usage
# - Reuse styles across all list items
# - Use LVGL label widgets (lightweight)
#
# =============================================================================

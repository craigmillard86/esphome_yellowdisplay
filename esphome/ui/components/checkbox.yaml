# =============================================================================
# UI Component: Checkbox (T092)
# Purpose: Reusable checkbox component for group selection
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts, icons)
# Exposes: Checkbox widget pattern with checked/unchecked visual states
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This file implements:
# - T092: Create checkbox component for group selection
#
# Checkbox Visual States:
#   - Unchecked: Empty square outline (0x666666)
#   - Checked: Filled square with checkmark (0x00D1FF cyan)
#   - Disabled: Greyed out (0x444444)
#
# Usage Pattern:
# The checkbox is implemented as a button containing two overlapping labels:
#   - One for the unchecked state (square outline icon)
#   - One for the checked state (check-square icon, hidden by default)
#
# To toggle checkbox state, call the toggle_checkbox script or
# use LVGL hidden flags directly:
#   lv_obj_add_flag(id(checkbox_N_unchecked), LV_OBJ_FLAG_HIDDEN);
#   lv_obj_clear_flag(id(checkbox_N_checked), LV_OBJ_FLAG_HIDDEN);
#
# Touch Target: 44x44px minimum per constitution 6.4
# Icon Size: 24x24px centered within touch target

# =============================================================================

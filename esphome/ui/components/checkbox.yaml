#
# =============================================================================
# Checkbox Icons Reference (MDI)
# =============================================================================
#
# Unchecked states:
#   \U000F0131 - mdi:checkbox-blank-outline (square outline)
#   \U000F0765 - mdi:circle-outline (circle outline)
#
# Checked states:
#   \U000F0132 - mdi:checkbox-marked (filled square with check)
#   \U000F012C - mdi:check-circle (filled circle with check)
#
# Alternative styles:
#   \U000F043D - mdi:radiobox-blank (radio button unchecked)
#   \U000F043E - mdi:radiobox-marked (radio button checked)
#
# =============================================================================
# Color Reference
# =============================================================================
#
# Primary cyan (checked/active): 0x00D1FF
# Grey (unchecked): 0x666666
# Disabled grey: 0x444444
# White (text): 0xFFFFFF
# Background dark: 0x1E1E1E
# Border: 0x2A2A2A
#
# =============================================================================

#             lv_obj_clear_flag(id(checkbox_N_checked), LV_OBJ_FLAG_HIDDEN);
#           } else {
#             // Currently checked, make unchecked
#             lv_obj_clear_flag(id(checkbox_N_unchecked), LV_OBJ_FLAG_HIDDEN);

                        id: grouping_0_checkbox_btn
                        x: 0
                        y: 0
                        width: 200
                        height: 44
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        pad_all: 0
                        on_click:
                          - script.execute:
                              id: grouping_toggle_checkbox
                              player_index: 0
                          - script.execute: grouping_update_checkboxes

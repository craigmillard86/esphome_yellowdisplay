            x: 8
            y: 174
            width: 304
            text_align: CENTER
            hidden: true

        # =====================================================================
        # BUTTON AREA (48px height)
        # =====================================================================

        # Cancel Button (T100)
        - button:
            id: btn_grouping_cancel
            x: 8
            y: 188
            width: 100
            height: 44
            bg_color: 0x2A2A2A
            radius: 8
            border_width: 0
            shadow_width: 0
            pressed:
              bg_color: 0x3A3A3A
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Grouping Cancel button pressed"
              - script.execute: grouping_cancel
            widgets:
              - label:
                  text: "Cancel"
                  text_font: roboto_16
                  text_color: 0xB3B3B3
                  align: CENTER

        # Apply Button (T096)
        - button:
            id: btn_grouping_apply
            align: TOP_RIGHT
            x: -8
            y: 188
            width: 140
            height: 44
            bg_color: 0x00D1FF
            radius: 8
            border_width: 0
            shadow_width: 0
            pressed:
              bg_color: 0x00A3CC
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Grouping Apply button pressed"
              - script.execute: grouping_apply
            widgets:
              - label:
                  id: lbl_apply_btn
                  text: "Apply Group"
                  text_font: roboto_16
                  text_color: 0x121212
                  align: CENTER

# =============================================================================
# Scripts - Grouping UI Updates
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  # Update Checkbox Visuals, Crown Icons, and Status Text
  # ---------------------------------------------------------------------------
  # Syncs checkbox/crown/status widget visibility with grouping state
  - id: grouping_update_checkboxes
    mode: restart
    then:
      - lambda: |-
          // Guard: Only update when grouping screen is active
          if (!id(grouping_screen_active)) {
            ESP_LOGD("grouping_ui", "Skipping checkbox update - screen not active");
            return;
          }

          ESP_LOGD("grouping_ui", "Updating checkbox visuals...");

          uint8_t states = id(grouping_checkbox_states);
          int visible_count = 0;
          std::string designated_leader = id(grouping_designated_leader);
          int mode = id(grouping_mode);
          int checked_count = id(grouping_checked_count);

          // Player data arrays for lookup
          std::string entities[8] = {
            id(player_0_entity_id), id(player_1_entity_id), id(player_2_entity_id), id(player_3_entity_id),
            id(player_4_entity_id), id(player_5_entity_id), id(player_6_entity_id), id(player_7_entity_id)
          };
          std::string names[8] = {
            id(player_0_name), id(player_1_name), id(player_2_name), id(player_3_name),
            id(player_4_name), id(player_5_name), id(player_6_name), id(player_7_name)
          };
          bool online[8] = {
            id(player_0_online), id(player_1_online), id(player_2_online), id(player_3_online),
            id(player_4_online), id(player_5_online), id(player_6_online), id(player_7_online)
          };
          int group_statuses[8] = {
            id(player_0_group_status), id(player_1_group_status), id(player_2_group_status), id(player_3_group_status),
            id(player_4_group_status), id(player_5_group_status), id(player_6_group_status), id(player_7_group_status)
          };

          // UI widget arrays
          lv_obj_t* rows[8] = {
            id(grouping_row_0), id(grouping_row_1), id(grouping_row_2), id(grouping_row_3),
            id(grouping_row_4), id(grouping_row_5), id(grouping_row_6), id(grouping_row_7)
          };
          lv_obj_t* unchecked_icons[8] = {
            id(grouping_0_unchecked), id(grouping_1_unchecked), id(grouping_2_unchecked), id(grouping_3_unchecked),
            id(grouping_4_unchecked), id(grouping_5_unchecked), id(grouping_6_unchecked), id(grouping_7_unchecked)
          };
          lv_obj_t* checked_icons[8] = {
            id(grouping_0_checked), id(grouping_1_checked), id(grouping_2_checked), id(grouping_3_checked),
            id(grouping_4_checked), id(grouping_5_checked), id(grouping_6_checked), id(grouping_7_checked)
          };
          lv_obj_t* crown_lbls[8] = {
            id(grouping_0_crown), id(grouping_1_crown), id(grouping_2_crown), id(grouping_3_crown),
            id(grouping_4_crown), id(grouping_5_crown), id(grouping_6_crown), id(grouping_7_crown)
          };
          lv_obj_t* name_lbls[8] = {
            id(grouping_0_name), id(grouping_1_name), id(grouping_2_name), id(grouping_3_name),
            id(grouping_4_name), id(grouping_5_name), id(grouping_6_name), id(grouping_7_name)
          };
          lv_obj_t* status_lbls[8] = {
            id(grouping_0_status), id(grouping_1_status), id(grouping_2_status), id(grouping_3_status),
            id(grouping_4_status), id(grouping_5_status), id(grouping_6_status), id(grouping_7_status)
          };

          // Update each row
          for (int idx = 0; idx < 8; idx++) {
            if (rows[idx] == nullptr) continue;

            if (entities[idx].empty()) {
              lv_obj_add_flag(rows[idx], LV_OBJ_FLAG_HIDDEN);
              continue;
            }

            visible_count++;
            lv_obj_clear_flag(rows[idx], LV_OBJ_FLAG_HIDDEN);

            // Update player name
            if (name_lbls[idx]) lv_label_set_text(name_lbls[idx], names[idx].c_str());

            bool is_online = online[idx];
            bool is_checked = (states & (1 << idx)) != 0;
            bool is_leader = (entities[idx] == designated_leader);

            // Update online/offline styling
            if (is_online) {
              if (name_lbls[idx]) lv_obj_set_style_text_color(name_lbls[idx], lv_color_hex(0xFFFFFF), 0);
              lv_obj_set_style_bg_opa(rows[idx], LV_OPA_COVER, 0);
            } else {
              if (name_lbls[idx]) lv_obj_set_style_text_color(name_lbls[idx], lv_color_hex(0x666666), 0);
              lv_obj_set_style_bg_opa(rows[idx], LV_OPA_70, 0);
            }

            // Update checkbox state
            if (is_checked) {
              if (unchecked_icons[idx]) lv_obj_add_flag(unchecked_icons[idx], LV_OBJ_FLAG_HIDDEN);
              if (checked_icons[idx]) lv_obj_clear_flag(checked_icons[idx], LV_OBJ_FLAG_HIDDEN);
            } else {
              if (unchecked_icons[idx]) lv_obj_clear_flag(unchecked_icons[idx], LV_OBJ_FLAG_HIDDEN);
              if (checked_icons[idx]) lv_obj_add_flag(checked_icons[idx], LV_OBJ_FLAG_HIDDEN);
            }

            // Update crown visibility (show only for designated leader)
            if (crown_lbls[idx]) {
              if (is_leader && is_checked) {
                lv_obj_clear_flag(crown_lbls[idx], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(crown_lbls[idx], LV_OBJ_FLAG_HIDDEN);
              }
            }

            // Update leader border highlight (gold border for designated leader)
            if (is_leader && is_checked) {
              lv_obj_set_style_border_color(rows[idx], lv_color_hex(0xFFD700), 0);  // Gold
              lv_obj_set_style_border_width(rows[idx], 2, 0);
            } else {
              lv_obj_set_style_border_color(rows[idx], lv_color_hex(0x2A2A2A), 0);  // Default
              lv_obj_set_style_border_width(rows[idx], 1, 0);
            }

            // Update status text
            if (status_lbls[idx]) {
              if (is_leader && is_checked) {
                lv_label_set_text(status_lbls[idx], "Leader");
                lv_obj_set_style_text_color(status_lbls[idx], lv_color_hex(0xFFD700), 0);  // Gold
              } else if (is_checked) {
                lv_label_set_text(status_lbls[idx], "In Group");
                lv_obj_set_style_text_color(status_lbls[idx], lv_color_hex(0x00D1FF), 0);  // Cyan
              } else if (is_online) {
                lv_label_set_text(status_lbls[idx], "Online");
                lv_obj_set_style_text_color(status_lbls[idx], lv_color_hex(0x666666), 0);  // Grey
              } else {
                lv_label_set_text(status_lbls[idx], "Offline");
                lv_obj_set_style_text_color(status_lbls[idx], lv_color_hex(0x666666), 0);  // Grey
              }
            }
          }

          // Update title based on mode
          lv_obj_t* title_lbl = id(lbl_grouping_title);
          if (title_lbl) {
            if (mode == 0) {
              lv_label_set_text(title_lbl, "Create Group");
            } else {
              lv_label_set_text(title_lbl, "Edit Group");
            }
          }

          // Update Apply button text based on mode
          lv_obj_t* apply_btn_lbl = id(lbl_apply_btn);
          if (apply_btn_lbl) {
            if (mode == 0) {
              lv_label_set_text(apply_btn_lbl, "Create Group");
            } else {
              lv_label_set_text(apply_btn_lbl, "Update Group");
            }
          }

          // Show/hide leader hint (show when 2+ players checked)
          lv_obj_t* hint_lbl = id(lbl_grouping_hint);
          if (hint_lbl) {
            if (checked_count >= 2) {
              lv_obj_clear_flag(hint_lbl, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(hint_lbl, LV_OBJ_FLAG_HIDDEN);
            }
          }

          // Show/hide "No players" message
          lv_obj_t* no_players = id(lbl_grouping_no_players);
          if (no_players) {
            if (visible_count == 0) {
              lv_obj_clear_flag(no_players, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(no_players, LV_OBJ_FLAG_HIDDEN);
            }
          }

          ESP_LOGD("grouping_ui", "Updated %d visible rows, states=0x%02X, mode=%d, leader=%s",
                   visible_count, states, mode, designated_leader.c_str());

      # Update status and button state
      - script.execute: grouping_update_ui

# =============================================================================
# Usage Notes
# =============================================================================
#
# NAVIGATION:
# Navigate to this screen using:
#   - script.execute:
#       id: navigate_to
#       target_screen: 5  # page_grouping index
#
# Or add to navigation.yaml screen list.
#
# WORKFLOW:
# 1. Screen loads → grouping_init populates initial checkbox states
# 2. User taps rows → grouping_toggle_checkbox toggles bit in bitmask
# 3. grouping_update_checkboxes syncs widget visuals
# 4. grouping_update_ui updates status label and Apply button state
# 5. Apply button → grouping_apply validates and sends group command
# 6. Cancel button → grouping_cancel restores original states and navigates back
#
# LAYOUT:
# - Header: 44px (back button, title, close button)
# - Player list: 116px scrollable (up to 8 rows @ 44px each)
# - Status: 24px (validation messages)
# - Buttons: 48px (Cancel + Apply)
# - Total: 232px (fits 240px with 4px margins)
#
# =============================================================================

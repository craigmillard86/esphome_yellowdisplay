                  id: grouping_row_0
                  width: 304
                  height: 44
                  bg_color: 0x1E1E1E
                  radius: 8
                  border_width: 1
                  border_color: 0x2A2A2A
                  shadow_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  hidden: true
                  widgets:
                    # Left side: Checkbox toggle area

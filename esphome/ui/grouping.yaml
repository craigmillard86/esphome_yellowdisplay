# =============================================================================
# UI Screen: Multi-room Grouping (T091, T093-T096, T099-T100)
# Purpose: Screen for creating and managing speaker groups
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts, icons)
#               packages/grouping.yaml (grouping business logic)
#               packages/player_manager.yaml (player state)
#               packages/navigation.yaml (screen navigation)
# Exposes: page_grouping LVGL page with player checkboxes
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This file implements:
# - T091: Create Multi-room Grouping screen with checklist layout
# - T093: Display all players with checkboxes
# - T094: Pre-check players already in current group
# - T096: Implement Apply button at bottom
# - T099: Display which players failed and why
# - T100: Implement Cancel button to discard changes

# Screen Layout:
# +--------------------------------------------------+
# | [<] Create Group / Edit Group              [X]   |  <- Header (44px, dynamic title)
# +--------------------------------------------------+
# | +----------------------------------------------+ |
# | | [x] 👑 Speaker Name               Leader     | |  <- Leader row (gold border)
# | +----------------------------------------------+ |  <- 44px each
# | | [x] 👑 Speaker 2                  In Group   | |  <- Member (crown to change leader)
# | +----------------------------------------------+ |
# | | [ ]    Speaker 3                  Online     | |  <- Unchecked
# | +----------------------------------------------+ |
# +--------------------------------------------------+
# | Select 2+ players to group                       |  <- Status (28px)
# | Tap crown to change leader                       |  <- Hint (shown when 2+ checked)
# +--------------------------------------------------+
# | [ Cancel ]               [ Create/Update Group ] |  <- Buttons (48px, dynamic text)
# +--------------------------------------------------+

lvgl:
  pages:
    # =========================================================================
    # Grouping Screen (T091)
    # =========================================================================
    - id: page_grouping
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      # Note: Initialization moved to navigation.yaml to avoid boot-time issues
      # on_load triggers when page is created, which may be at boot
      widgets:
        # =====================================================================
        # HEADER AREA (44px height)
        # =====================================================================

        # Back/Cancel Button - Top Left (44x44px touch target)
        - button:
            id: btn_grouping_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Grouping screen back button pressed"
              - script.execute: grouping_cancel
            widgets:
              - label:
                  text: "\U000F004D"  # mdi:arrow-left
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Screen Title
        - label:
            id: lbl_grouping_title
            text: "Create Group"
            text_font: roboto_16
            text_color: 0xFFFFFF
            align: TOP_MID
            x: 0
            y: 12
            text_align: CENTER

        # Close/Cancel Button - Top Right (44x44px touch target)
        - button:
            id: btn_grouping_close
            align: TOP_RIGHT
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - script.execute: grouping_cancel
            widgets:
              - label:
                  text: "\U000F0156"  # mdi:close
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Header Divider Line
        - obj:
            x: 0
            y: 43
            width: 320
            height: 1
            bg_color: 0x2A2A2A
            bg_opa: COVER
            border_width: 0

        # =====================================================================
        # SCROLLABLE PLAYER CHECKLIST CONTAINER
        # =====================================================================
        # Position: Below header, above status and buttons
        # Size: 320x116 (240 - 44 header - 28 status - 4 gap - 48 buttons)

        - obj:
            id: grouping_list_container
            x: 0
            y: 44
            width: 320
            height: 116
            bg_color: 0x121212
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            pad_all: 4
            scrollbar_mode: AUTO
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              # =================================================================
              # PLAYER CHECKBOX ROW 0
              # =================================================================

                              text_font: icons_24
                              text_color: 0x666666
                              x: 12
                              y: 10
                          # Checked checkbox icon
                          - label:
                              id: grouping_0_checked
                              text: "\U000F0132"  # mdi:checkbox-marked
                              text_font: icons_24
                              text_color: 0x00D1FF
                              x: 12
                              y: 10
                              hidden: true

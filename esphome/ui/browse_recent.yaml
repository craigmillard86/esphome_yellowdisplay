# =============================================================================
# UI Screen: Recently Played Browse List (T074, T080, T081, T088)
# Purpose: Display recently played tracks/albums
# Dependencies: packages/lvgl.yaml (LVGL framework, theme, fonts, icons)
#               packages/navigation.yaml (screen navigation)
#               packages/browse.yaml (browse scripts, play_media_item)
#               ui/components/list_item.yaml (list item pattern)
#               ui/components/loading.yaml (loading indicator pattern)
#               ui/components/empty_state.yaml (empty state pattern)
# Exposes: page_browse_recent LVGL page with scrollable list
# Display: 320x240 ILI9341 in landscape orientation
# =============================================================================

# This file implements:
# - T074: Implement Recently Played list view
# - T080: Add loading indicator during content fetch
# - T081: Add empty state message for empty categories
# - T088: Add navigation breadcrumbs or back button
#
# Screen Layout (Screen G per ui-technical-spec.md):
# +--------------------------------------------------+
# | [<] Recently Played                    1-10 of N |  <- Header (44px)
# +--------------------------------------------------+
# | +----------------------------------------------+ |
# | | Track Title 1                                | |  <- List items
# | | Artist - Album                               | |  <- 36px each
# | +----------------------------------------------+ |
# | | Track Title 2                                | |
# | | Artist - Album                               | |
# | +----------------------------------------------+ |
# | | ...                                          | |
# | +----------------------------------------------+ |
# +--------------------------------------------------+
# |         [< Prev]              [Next >]         |  <- Pagination footer
# +--------------------------------------------------+

lvgl:
  pages:
    # =========================================================================
    # Recently Played Browse Screen (T074)
    # =========================================================================
    - id: page_browse_recent
      bg_color: 0x121212
      border_width: 0
      shadow_width: 0
      on_load:
        # Load recently played content when screen is shown
        - logger.log:
            tag: "browse"
            level: INFO
            format: "Recently Played screen loaded"
        # Show loading indicator
        - lambda: |-
            lv_obj_clear_flag(id(loading_indicator_recent), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(empty_state_recent), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_pagination_footer), LV_OBJ_FLAG_HIDDEN);
        # Load content
        - script.execute:
            id: browse_category
            category: 1  # RECENT
      widgets:
        # =====================================================================
        # HEADER AREA (44px height)
        # =====================================================================

        # Back Button - Top Left (44x44px touch target)
        - button:
            id: btn_recent_back
            x: 0
            y: 0
            width: 44
            height: 44
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - logger.log:
                  tag: "ui"
                  level: INFO
                  format: "Recently Played back button pressed"
              - script.execute: navigate_back
            widgets:
              - label:
                  text: "\U000F004D"  # mdi:arrow-left
                  text_font: icons_24
                  text_color: 0xB3B3B3
                  align: CENTER

        # Screen Title
        - label:
            id: lbl_recent_title
            text: "Recently Played"
            text_font: roboto_16
            text_color: 0xFFFFFF
            align: TOP_MID
            x: 0
            y: 12
            text_align: CENTER

        # Page Indicator (right aligned)
        - label:
            id: lbl_recent_page_indicator
            text: ""
            text_font: roboto_12
            text_color: 0x808080
            align: TOP_RIGHT
            x: -8
            y: 14


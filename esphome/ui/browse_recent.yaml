# =============================================================================
# Scripts - UI Update Logic
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  # Update Recent List UI
  # ---------------------------------------------------------------------------
  # Populates list items from browse global variables
  # Called automatically by browse.yaml after data loads
  - id: update_recent_list
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("browse_ui", "Updating Recent list UI");

          int loaded_count = id(browse_loaded_items);
          int offset = id(browse_page_offset);
          int total = id(browse_total_items);

          // Hide loading indicator
          lv_obj_add_flag(id(loading_indicator_recent), LV_OBJ_FLAG_HIDDEN);

          // Show empty state if no items loaded
          if (loaded_count == 0) {
            ESP_LOGI("browse_ui", "No items loaded, showing empty state");
            lv_obj_clear_flag(id(empty_state_recent), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_pagination_footer), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(lbl_recent_page_indicator), "");
            // Hide all list items
            lv_obj_add_flag(id(recent_item_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_2), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_3), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_4), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_5), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_6), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_7), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_8), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(recent_item_9), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // Hide empty state
          lv_obj_add_flag(id(empty_state_recent), LV_OBJ_FLAG_HIDDEN);

          // Update page indicator
          char page_text[32];
          if (total > 0) {
            snprintf(page_text, sizeof(page_text), "%d-%d of %d", offset + 1, offset + loaded_count, total);
          } else {
            snprintf(page_text, sizeof(page_text), "%d-%d", offset + 1, offset + loaded_count);
          }
          lv_label_set_text(id(lbl_recent_page_indicator), page_text);

          // Show/hide pagination buttons based on position
          if (loaded_count > 0 && (offset > 0 || (total > 0 && offset + loaded_count < total))) {
            lv_obj_clear_flag(id(recent_pagination_footer), LV_OBJ_FLAG_HIDDEN);

            // Prev button visibility
            if (offset > 0) {
              lv_obj_clear_flag(id(btn_recent_prev), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(btn_recent_prev), LV_OBJ_FLAG_HIDDEN);
            }

            // Next button visibility
            if (total > 0 && offset + loaded_count < total) {
              lv_obj_clear_flag(id(btn_recent_next), LV_OBJ_FLAG_HIDDEN);
            } else if (total == 0 && loaded_count == 10) {
              // If we don't know total but got full page, assume more
              lv_obj_clear_flag(id(btn_recent_next), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(btn_recent_next), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(recent_pagination_footer), LV_OBJ_FLAG_HIDDEN);
          }

          // Update Item 0
          if (loaded_count > 0) {
            lv_label_set_text(id(lbl_recent_item_0_title), id(browse_item_0_title).c_str());
            lv_label_set_text(id(lbl_recent_item_0_subtitle), id(browse_item_0_subtitle).c_str());
            lv_obj_clear_flag(id(recent_item_0), LV_OBJ_FLAG_HIDDEN);
            ESP_LOGD("browse_ui", "Item 0: %s - %s", id(browse_item_0_title).c_str(), id(browse_item_0_subtitle).c_str());
          } else {
            lv_obj_add_flag(id(recent_item_0), LV_OBJ_FLAG_HIDDEN);
          }

          // Update Item 1
          if (loaded_count > 1) {

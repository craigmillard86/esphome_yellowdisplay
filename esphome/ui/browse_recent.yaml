# =============================================================================
# Implementation Notes
# =============================================================================
#
# Data Population:
# - on_load trigger calls browse_category script with category: 1 (RECENT)
# - browse.yaml populates browse_item_X_* global variables
# - Lambda code updates LVGL widgets from global variables
# - Show/hide list items based on browse_loaded_items count
#
# Loading State Flow:
# 1. on_load: Show loading_indicator_recent, hide empty_state_recent
# 2. browse_category: Fetch data from Music Assistant
# 3. On success: Hide loading_indicator_recent, show list items
# 4. On empty: Hide loading_indicator_recent, show empty_state_recent
# 5. On error: Hide loading_indicator_recent, show error message
#
# Tap-to-Play Flow (T082):
# 1. User taps list item button
# 2. on_click calls play_media_item script
# 3. Script reads media_id from browse_item_X_media_id
# 4. Calls music_assistant.play_media service
# 5. Playback starts on selected player
#
# Memory Management:
# - Maximum 10 visible items per page with pagination
# - Each item ~200 bytes (button + 2 labels, smaller font)
# - Total: ~2KB for all 10 items (safe for ESP32)
# - Clear data on screen exit (navigate_back)
#
# =============================================================================

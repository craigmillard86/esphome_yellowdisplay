# =============================================================================
# Music Assistant Media Controller - Freenove ESP32-S3 CYD
# =============================================================================
# Board: Freenove ESP32-S3 with 2.8" Display
# Display: 2.8" ILI9341 TFT 320x240 with FT6336 capacitive touch
# MCU: ESP32-S3 @ 240MHz with 8MB PSRAM
#
# For original ESP32-2432S028R, use main.yaml instead
# =============================================================================

substitutions:
  # Device identification
  device_name: "cyd_music_remote_s3"
  friendly_name: "Music Remote S3"

  # Display configuration
  screen_rotation: "90"  # 90 = landscape, 0 = portrait
  default_brightness: "50"  # 0-100%

# =============================================================================
# Device Configuration
# =============================================================================

packages:
  # Device-specific substitutions (pins, platform settings)
  device: !include devices/freenove_s3.yaml

  # Base configuration (shared across all devices)
  base: !include packages/base.yaml

  # Hardware packages (device-specific)
  spi: !include packages/hardware/spi_freenove_s3.yaml
  display: !include packages/hardware/display_freenove_s3.yaml
  backlight: !include packages/hardware/backlight.yaml
  touch: !include packages/hardware/touch_ft63x6.yaml

  # Feature packages
  wifi: !include packages/wifi.yaml
  homeassistant: !include packages/homeassistant.yaml
  lvgl: !include packages/lvgl.yaml
  state_machine: !include packages/state_machine.yaml
  connectivity: !include packages/connectivity.yaml
  media_player: !include packages/media_player.yaml
  album_art: !include packages/album_art.yaml
  navigation: !include packages/navigation.yaml
  player_manager: !include packages/player_manager.yaml
  browse: !include packages/browse.yaml
  grouping: !include packages/grouping.yaml
  idle: !include packages/idle.yaml
  settings: !include packages/settings.yaml

  # With PSRAM, we can enable memory-intensive features:
  diagnostics: !include packages/diagnostics.yaml
  search: !include packages/search.yaml
  error_handler: !include packages/error_handler.yaml
  burn_in: !include packages/burn_in_mitigation.yaml

  # UI Screens
  players_ui: !include ui/players.yaml
  grouping_ui: !include ui/grouping.yaml
  library_ui: !include ui/library.yaml
  browse_ui: !include ui/browse_unified.yaml
  settings_ui: !include ui/settings.yaml
  search_ui: !include ui/search.yaml  # Enabled with PSRAM

  # UI Components
  header: !include ui/components/header.yaml
  error_toast: !include ui/components/error_toast.yaml  # Enabled with PSRAM

# =============================================================================
# ESP32-S3 Platform Configuration
# =============================================================================

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: arduino
    version: recommended
    sdkconfig_options:
      # Reduce logging overhead
      CONFIG_LOG_DEFAULT_LEVEL_INFO: "y"
      CONFIG_LOG_MAXIMUM_LEVEL_INFO: "y"

      # Reduce task watchdog timeout
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "5"

      # Disable features we don't use
      CONFIG_ESP32_ENABLE_COREDUMP: "n"

      # LWIP (network stack) optimizations
      CONFIG_LWIP_MAX_SOCKETS: "10"
      CONFIG_LWIP_TCP_MSS: "1440"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "11488"
      CONFIG_LWIP_TCP_WND_DEFAULT: "11488"

# =============================================================================
# PSRAM Configuration
# =============================================================================

psram:
  mode: octal
  speed: 80MHz

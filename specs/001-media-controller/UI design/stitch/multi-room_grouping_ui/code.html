<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Multi-Room Grouping UI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar to keep it clean on small screens */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #233648;
            border-radius: 10px;
        }
        .custom-checkbox {
            --checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<!-- Main Container: Sized for 320x240 layout but responsive -->
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden max-w-[320px] mx-auto shadow-2xl border-x border-gray-800">
<!-- Header: TopAppBar style -->
<header class="flex items-center bg-background-light dark:bg-background-dark px-4 py-3 justify-between border-b border-gray-200 dark:border-gray-800 sticky top-0 z-10">
<div class="text-primary dark:text-white flex size-8 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-gray-900 dark:text-white text-base font-bold leading-tight tracking-tight flex-1 text-center">Sync Group</h2>
<div class="size-8"></div> <!-- Spacer for symmetry -->
</header>
<!-- Scrollable Player List -->
<main class="flex-1 overflow-y-auto px-2 py-2 space-y-1 custom-checkbox">
<!-- List Item 1 -->
<div class="flex items-center gap-3 bg-white dark:bg-[#1a2632] px-3 min-h-[64px] py-2 justify-between rounded-lg">
<div class="flex items-center gap-3">
<div class="text-white flex items-center justify-center rounded-lg bg-primary shrink-0 size-10">
<span class="material-symbols-outlined text-xl">speaker</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-gray-900 dark:text-white text-sm font-semibold leading-none mb-1">Living Room</p>
<p class="text-gray-500 dark:text-[#92adc9] text-xs font-normal leading-none">Playing</p>
</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<input checked="" class="h-6 w-6 rounded border-gray-300 dark:border-[#324d67] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
<!-- List Item 2 -->
<div class="flex items-center gap-3 bg-white dark:bg-[#1a2632] px-3 min-h-[64px] py-2 justify-between rounded-lg">
<div class="flex items-center gap-3">
<div class="text-gray-400 dark:text-[#92adc9] flex items-center justify-center rounded-lg bg-gray-100 dark:bg-[#233648] shrink-0 size-10">
<span class="material-symbols-outlined text-xl">speaker_group</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-gray-900 dark:text-white text-sm font-semibold leading-none mb-1">Kitchen Speaker</p>
<p class="text-gray-500 dark:text-[#92adc9] text-xs font-normal leading-none">Idle</p>
</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded border-gray-300 dark:border-[#324d67] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
<!-- List Item 3 -->
<div class="flex items-center gap-3 bg-white dark:bg-[#1a2632] px-3 min-h-[64px] py-2 justify-between rounded-lg">
<div class="flex items-center gap-3">
<div class="text-gray-400 dark:text-[#92adc9] flex items-center justify-center rounded-lg bg-gray-100 dark:bg-[#233648] shrink-0 size-10">
<span class="material-symbols-outlined text-xl">tv</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-gray-900 dark:text-white text-sm font-semibold leading-none mb-1">Bedroom TV</p>
<p class="text-gray-500 dark:text-[#92adc9] text-xs font-normal leading-none">Standby</p>
</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded border-gray-300 dark:border-[#324d67] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
<!-- List Item 4 -->
<div class="flex items-center gap-3 bg-white dark:bg-[#1a2632] px-3 min-h-[64px] py-2 justify-between rounded-lg">
<div class="flex items-center gap-3">
<div class="text-gray-400 dark:text-[#92adc9] flex items-center justify-center rounded-lg bg-gray-100 dark:bg-[#233648] shrink-0 size-10">
<span class="material-symbols-outlined text-xl">speaker</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-gray-900 dark:text-white text-sm font-semibold leading-none mb-1">Patio Mini</p>
<p class="text-gray-500 dark:text-[#92adc9] text-xs font-normal leading-none">Idle</p>
</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded border-gray-300 dark:border-[#324d67] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
<!-- List Item 5 -->
<div class="flex items-center gap-3 bg-white dark:bg-[#1a2632] px-3 min-h-[64px] py-2 justify-between rounded-lg">
<div class="flex items-center gap-3">
<div class="text-gray-400 dark:text-[#92adc9] flex items-center justify-center rounded-lg bg-gray-100 dark:bg-[#233648] shrink-0 size-10">
<span class="material-symbols-outlined text-xl">surround_sound</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-gray-900 dark:text-white text-sm font-semibold leading-none mb-1">Basement</p>

</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded border-gray-300 dark:border-[#324d67] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
</main>
<!-- Sticky Footer -->
<footer class="p-3 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-lg">check_circle</span>
<span class="text-sm">Apply Grouping</span>
</button>
</footer>
</div>
</body></html>
